<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачник — ВЕКТОР</title>
<meta name="theme-color" content="#f5f5f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Задачник">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a18'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --line: #d5d5d7;
    --ink: #1d1d1f;
    --muted: #86868b;
    --soft: #f5f5f7;
    --accent: #0071e3;
    --red: #ff3b30;
    --amber: #ff9500;
    --gutter: 40px;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  button, input, select, textarea { font-family: inherit; }

  /* ---------- Login ---------- */
  #login-page {
    display: flex; align-items: center; justify-content: center;
    height: 100%; background: var(--bg);
  }
  body.authed #login-page { display: none; }
  .login-box {
    width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,.08);
  }
  .login-logo { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-align: center; color: var(--muted); margin-bottom: 16px; }
  .login-box h1 { font-size: 28px; margin: 0 0 28px; text-align: center; font-weight: 600; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 8px; font-weight: 500; }
  .field input {
    width: 100%; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--accent); background: #fff; }
  .btn-primary {
    width: 100%; padding: 14px; border: none; background: var(--accent); color: #fff;
    border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer;
  }
  .btn-primary:hover { background: #0056b3; }
  .link-btn {
    width: 100%; margin-top: 12px; padding: 8px; border: none; background: none;
    color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline;
  }
  #login-error {
    margin-top: 14px; padding: 11px; border-radius: 9px; background: #fdf0f0;
    color: #a33020; font-size: 13px; display: none;
  }

  /* ---------- App shell ---------- */
  #app { display: none; height: 100%; }
  body.authed #app { display: flex; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 238px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 20px 12px 16px;
  }
  .sidebar .logo {
    padding: 0 4px 20px; line-height: 1.3;
    display: flex; align-items: center; gap: 9px;
  }
  .sidebar .logo-mark { width: 22px; height: auto; flex-shrink: 0; display: block; }
  .sidebar .logo-text { display: block; min-width: 0; }
  .sidebar .logo b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .sidebar .logo-text span { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0; }
  .sidebar-nav {
    display: flex; flex-direction: column; gap: 3px;
    padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px;
    border: none; background: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; color: var(--ink); text-align: left; font-weight: 500;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .nav-ico {
    width: 27px; height: 27px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--soft); color: var(--muted);
  }
  .nav-ico svg { width: 15px; height: 15px; display: block; }
  .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-btn:hover { background: var(--soft); }
  .nav-btn.active { background: rgba(0, 113, 227, .1); color: var(--accent); font-weight: 600; }
  .nav-btn.active .nav-ico { background: var(--accent); color: #fff; }
  .nav-btn.active:hover { background: rgba(0, 113, 227, .14); }
  .sidebar-header {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;
    font-weight: 600; padding: 0 4px; margin-bottom: 10px; margin-top: 14px;
  }
  .sidebar-projects { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .proj {
    display: flex; align-items: center; gap: 7px; width: 100%; padding: 9px 6px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    border: none; background: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: var(--ink); text-align: left;
  }
  .proj:hover { background: var(--soft); }
  .proj.active { background: var(--soft); color: var(--accent); font-weight: 500; }
  .proj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Ползунок проекта: учитывать ли проект в сводке на дашборде */
  .proj-switch {
    position: relative; width: 30px; height: 18px; flex-shrink: 0;
    background: #d8d8d3; border-radius: 999px; cursor: pointer;
    transition: background .15s ease;
  }
  .proj-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.22);
    transition: transform .15s ease;
  }
  .proj-switch.on { background: #34c759; }
  .proj-switch.on::after { transform: translateX(12px); }
  .proj.off .proj-name, .proj.off .proj-count { color: #b9b9b3; }

  .proj-count {
    font-size: 12px; color: var(--muted); background: transparent; border-radius: 8px;
    padding: 2px 6px; flex-shrink: 0;
  }
  .proj.active .proj-count { color: var(--accent); font-weight: 500; }
  .proj-edit {
    border: none; background: none; color: inherit; cursor: pointer; font-size: 13px;
    padding: 2px 4px; opacity: 0.5; flex-shrink: 0;
  }
  .proj.active .proj-edit { opacity: 0.6; color: var(--accent); }
  .proj-drag {
    flex-shrink: 0; cursor: grab; font-size: 12px; line-height: 1; padding: 3px 1px;
    color: inherit; opacity: .3; letter-spacing: -1px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .proj.active .proj-drag { opacity: .6; }
  .proj.dragging {
    opacity: .75; background: #e6e6e1; box-shadow: 0 3px 10px rgba(0,0,0,.12);
  }
  .proj.dragging .proj-drag { cursor: grabbing; }
  .proj:active { background: #e6e6e1; }
  .proj.active:active { background: var(--ink); }

  /* Hover-эффекты только для мыши. На тач-экранах :hover «залипает»:
     первое касание отрабатывает как наведение, и клик срабатывает лишь со второго раза. */
  @media (hover: hover) and (pointer: fine) {
    .proj:hover { background: #efefeb; }
    .proj.active:hover { background: var(--ink); }
    .proj-edit { opacity: 0; }
    .proj:hover .proj-edit, .proj.active .proj-edit { opacity: .55; }
    .proj-edit:hover { opacity: 1 !important; }
    .task-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .btn-icon:hover { background: #f7f7f5; }
    .sidebar-add button:hover { border-color: #a8a8a2; color: #55554f; }
    #logout-btn:hover { background: #ebebe7; color: var(--ink); }
  }
  .sidebar-add { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .sidebar-add button {
    width: 100%; padding: 10px; border: 1px dashed #c8c8c2; background: none;
    color: var(--muted); border-radius: 9px; font-size: 13px; cursor: pointer;
  }

  .sidebar-footer { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #logout-btn {
    width: 100%; padding: 9px 10px; border: none; background: none; border-radius: 9px;
    color: var(--muted); cursor: pointer; font-size: 13px; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #logout-btn:active { background: #ebebe7; }
  #voice-reply-btn {
    width: 100%; padding: 9px 10px; border: none; background: none; border-radius: 9px;
    color: var(--muted); cursor: pointer; font-size: 13px; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #voice-reply-btn:active { background: #ebebe7; }

  /* ---------- Main ---------- */
  .main { flex: 1; overflow-y: auto; }
  .main-inner { width: 100%; padding: 0 var(--gutter) 110px; }
  header {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
    margin-bottom: 0; padding-bottom: 0; border-bottom: 1px solid var(--line);
    flex-wrap: nowrap; position: sticky; top: 0; background: var(--panel); z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
    margin-left: calc(-1 * var(--gutter)); margin-right: calc(-1 * var(--gutter));
    padding-left: var(--gutter); padding-right: var(--gutter); padding-top: 18px;
  }
  header h1 {
    font-size: 28px; margin: 0; letter-spacing: -0.5px; font-weight: 600;
    flex: 0 0 230px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* В сводных разделах заголовок не нужен: «Сегодня» дублирует подпись первой
     колонки, «Дашборд» — выделенный пункт левого меню. */
  body.global-mode.view-today header h1,
  body.global-dashboard header h1 { display: none; }
  .view-tabs {
    display: flex; gap: 4px; margin: 0;
    overflow-x: auto; align-items: flex-end; padding-bottom: 0;
  }
  .vtab {
    border: 1px solid var(--line); border-bottom: none;
    background: var(--soft); color: var(--muted); font-size: 14px; white-space: nowrap;
    padding: 10px 16px; cursor: pointer; margin-bottom: 0; border-radius: 10px 10px 0 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; font-weight: 500;
    position: relative; top: 1px;
  }
  .vtab.active {
    background: var(--panel); color: var(--ink); font-weight: 600;
    border-color: var(--line); top: 0; box-shadow: 0 -2px 8px rgba(0,0,0,.05);
  }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--muted); flex-shrink: 0; }
  /* Строка занимает своё место всегда, даже пустая — иначе появление
     надписи сдвигало бы соседние элементы. */
  #save-indicator {
    height: 18px; line-height: 18px; font-size: 12px; color: var(--muted);
    padding: 0 6px; margin-bottom: 4px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }

  .stats { display: none; }
  .stats .overdue-count { color: var(--red); font-weight: 600; }

  /* ---------- Add task ---------- */
  .add-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px; margin: 18px 0; box-shadow: 0 1px 3px rgba(0,0,0,.05);
    display: flex; gap: 10px; align-items: center;
  }
  .add-title, .add-desc {
    border: 1px solid var(--line); outline: none; font-size: 15px;
    padding: 0 14px; background: var(--soft); border-radius: 10px; height: 44px;
    box-sizing: border-box; min-width: 0;
  }
  .add-title { flex: 1 1 34%; font-weight: 500; }
  .add-desc { flex: 1 1 66%; font-weight: 400; }
  .add-title:focus, .add-desc:focus { outline: none; border-color: var(--accent); background: #fff; }
  .add-row { display: flex; gap: 10px; align-items: center; margin-top: 0; flex-wrap: nowrap; }
  .add-row input[type=date], .add-row select {
    border: 1px solid var(--line); border-radius: 10px; padding: 0 9px;
    font-size: 13px; color: var(--ink); background: var(--soft); height: 44px; flex-shrink: 0;
    box-sizing: border-box;
  }
  .add-row input[type=date] { width: 122px; }
  .add-row select { width: 96px; }
  .add-row input[type=date]:focus, .add-row select:focus {
    outline: none; border-color: var(--accent); background: #fff;
  }
  .add-row .spacer { display: none; }

  /* Пустое поле даты: вместо системного «дд.мм.гггг» показываем серое «без даты» */
  input[type=date].is-empty { position: relative; }
  input[type=date].is-empty::-webkit-datetime-edit { color: transparent; }
  input[type=date].is-empty::before {
    content: 'без даты'; position: absolute; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; white-space: nowrap;
  }
  .add-row input[type=date].is-empty::before { left: 11px; }
  .modal-field input[type=date].is-empty::before { left: 12px; }

  .btn-icon {
    width: 40px; height: 40px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  #voice-btn {
    width: 48px; height: 44px; font-size: 25px; line-height: 1;
    background: var(--soft); border: 1px solid var(--line); color: var(--ink); flex-shrink: 0;
  }
  #voice-btn.listening {
    background: var(--red); border-color: var(--red); color: #fff;
    box-shadow: 0 2px 9px rgba(255,59,48,.4); animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }

  /* ---------- Большая кнопка диктовки (телефон, дашборд) ---------- */
  #mic-dock {
    position: fixed; left: 0; right: 0; z-index: 120;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none;
  }
  #mic-hint {
    max-width: min(88vw, 460px); background: rgba(29,29,31,.93); color: #fff;
    font-size: 14px; line-height: 1.4; padding: 10px 15px; border-radius: 15px;
    text-align: center; opacity: 0; transform: translateY(6px);
    transition: opacity .16s ease, transform .16s ease;
  }
  #mic-hint.show { opacity: 1; transform: none; }
  #mic-hint.tappable { pointer-events: auto; cursor: pointer; background: rgba(0, 113, 227, .95); }
  #mic-fab {
    display: none; pointer-events: auto; position: relative;
    width: 96px; height: 96px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.22);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: background .15s ease, transform .1s ease;
  }
  #mic-fab:active { transform: scale(.94); }
  #mic-fab .mic-glyph { width: 40px; height: 40px; }
  #mic-fab.listening { background: var(--red); }
  #mic-fab.processing { background: #6f6f68; }
  /* расходящиеся круги — видно, что идёт запись */
  #mic-fab.listening::before, #mic-fab.listening::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--red); animation: mic-ring 1.7s ease-out infinite;
  }
  #mic-fab.listening::after { animation-delay: .85s; }
  @keyframes mic-ring {
    0%   { transform: scale(1);   opacity: .65; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  @media (max-width: 860px) {
    body.global-dashboard #mic-fab { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    #mic-fab.listening::before, #mic-fab.listening::after { animation: none; opacity: .4; }
  }
  .btn-add {
    border: none; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 0 14px; font-size: 14px; font-weight: 500; cursor: pointer; height: 44px;
    flex-shrink: 0; box-sizing: border-box; white-space: nowrap;
  }
  .btn-add:hover { background: #0056b3; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; gap: 0; background: var(--panel);
    border-radius: 0; border-bottom: 1px solid var(--line);
    position: sticky; top: var(--header-height, 76px); z-index: 98;
    margin: 0 calc(-1 * var(--gutter)) 18px; padding: 0 var(--gutter);
  }
  .tab {
    border: none; background: none; color: var(--muted); font-size: 15px;
    padding: 12px 18px; border-radius: 0; cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { background: none; color: var(--ink); font-weight: 500; border-bottom-color: var(--accent); }

  /* ---------- Task list ---------- */
  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task-row {
    display: flex; align-items: flex-start; gap: 12px; background: var(--panel);
    border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: 12px;
    padding: 16px; cursor: pointer; transition: box-shadow .15s, background .15s;
  }
  .task-row:hover { background: var(--soft); }
  .task-row.overdue { border-left-color: var(--red); }
  .task-row.due-today { border-left-color: var(--amber); }
  .task-row.done { opacity: .5; }
  .task-checkbox {
    width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--ink);
    cursor: pointer; flex-shrink: 0;
  }
  .task-main { flex: 1; min-width: 0; }
  .task-title { font-size: 16px; line-height: 1.4; font-weight: 500; }
  .task-row.prio-high .task-title { color: var(--red); }
  .task-row.done.prio-high .task-title { color: var(--muted); }
  .task-row.done .task-title { text-decoration: line-through; opacity: 0.6; }
  .task-desc {
    font-size: 14px; color: var(--muted); margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task-meta { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pill {
    font-size: 12px; padding: 4px 10px; border-radius: 6px; background: var(--soft);
    color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-weight: 500;
  }
  .pill.overdue { background: #ffebee; color: var(--red); font-weight: 600; }
  .pill.today { background: #fff3e0; color: var(--amber); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.high { background: var(--red); }
  .dot.normal { background: var(--amber); }
  .dot.low { background: #c3c3bd; }
  .task-del {
    border: none; background: none; color: #c9c9c3; font-size: 19px; line-height: 1;
    cursor: pointer; padding: 0 2px; flex-shrink: 0;
  }
  .task-del:hover { color: var(--red); }
  .empty-state { text-align: center; color: #b0b0aa; font-size: 14px; padding: 56px 20px; }

  .vtab .vtab-count {
    font-size: 11px; color: var(--muted); background: var(--soft); border-radius: 6px;
    padding: 2px 6px; margin-left: 6px; font-weight: 500;
  }
  .vtab.active .vtab-count { background: var(--accent); color: #fff; }

  #view-today, #view-week, #view-list, #view-protocols, #view-notes, #view-dashboard { display: none; }
  body.global-mode .view-tabs, body.global-mode .add-card { display: none; }
  body.global-dashboard #view-today { display: none; }
  body.global-dashboard #view-dashboard { display: block; }
  body.view-today #view-today, body.view-week #view-week, body.view-list #view-list,
  body.view-protocols #view-protocols, body.view-notes #view-notes { display: block; }
  body.view-protocols .add-card, body.view-notes .add-card { display: none; }

  /* ---------- Компактная карточка задачи (доски «Неделя» и «Сегодня») ---------- */
  .tcard {
    display: flex; align-items: flex-start; gap: 7px; background: #fff;
    border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: 9px;
    padding: 8px 9px; cursor: pointer; font-size: 13px; line-height: 1.35;
  }
  .tcard.overdue { border-left-color: var(--red); }
  .tcard.due-today { border-left-color: var(--amber); }
  .tcard.done { opacity: .5; }
  .tcard.done .tcard-title { text-decoration: line-through; }
  .tcard-grip {
    flex-shrink: 0; cursor: grab; color: var(--muted); opacity: .45; font-size: 12px;
    line-height: 1.3; letter-spacing: -1px; padding: 0 1px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tcard-check { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--ink); cursor: pointer; flex-shrink: 0; }
  .tcard-body { flex: 1; min-width: 0; }
  .tcard-title { word-wrap: break-word; }
  .tcard.prio-high .tcard-title { color: var(--red); font-weight: 500; }
  .tcard.done.prio-high .tcard-title { color: var(--muted); font-weight: 400; }
  .tcard-desc {
    font-size: 12px; color: #85857e; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tcard-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .tcard.drag-source { opacity: .35; pointer-events: none; }
  body.dragging-task { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  body.dragging-task .tcard { cursor: grabbing; }
  .drag-ghost {
    position: fixed; z-index: 3000; pointer-events: none; max-width: 220px;
    background: var(--ink); color: #fff; font-size: 12px; padding: 7px 10px; border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.28); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .drop-hover { background: #eef3ff !important; outline: 2px dashed #2f6fed; outline-offset: -2px; }

  /* ---------- Неделя ---------- */
  .week-bar {
    display: flex; align-items: center; gap: 8px; padding: 6px var(--gutter);
    margin: 0 calc(-1 * var(--gutter)) 10px;
    position: sticky; top: var(--header-height, 76px); background: var(--panel); z-index: 98;
    border-bottom: 1px solid var(--line);
  }
  .week-bar .week-label { font-size: 13px; font-weight: 600; }
  .week-nav {
    border: 1px solid var(--line); background: #fff; border-radius: 7px; cursor: pointer;
    width: 26px; height: 26px; font-size: 14px; line-height: 1; padding: 0; color: #55554f;
  }
  .week-now {
    border: 1px solid var(--line); background: #fff; border-radius: 7px; cursor: pointer;
    height: 26px; padding: 0 10px; font-size: 12px; color: #55554f;
  }
  .week-board { display: flex; gap: 10px; align-items: flex-start; overflow-x: auto; padding-bottom: 10px; }
  .week-col {
    flex: 1 1 0; min-width: 165px; background: var(--soft); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px; display: flex; flex-direction: column; gap: 7px;
  }
  .week-col.is-today { border-color: #c9c9c1; background: #fffdf5; }
  .week-col-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
    font-size: 12px; font-weight: 700; color: #6f6f68; padding: 2px 2px 4px;
  }
  .week-col.is-today .week-col-head { color: var(--ink); }
  .week-col-head .wd { font-size: 11px; font-weight: 500; color: var(--muted); }
  .week-drop { display: flex; flex-direction: column; gap: 7px; min-height: 70px; border-radius: 9px; padding: 2px; }
  .week-empty { font-size: 12px; color: #b5b5ae; text-align: center; padding: 14px 4px; }
  .week-backlog { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  .week-backlog h3 { font-size: 13px; color: var(--ink); font-weight: 600; margin: 0 0 12px; }
  .week-backlog-hint { color: var(--muted); font-weight: 400; }
  .week-backlog-cols { display: flex; gap: 10px; align-items: flex-start; }
  .backlog-col {
    flex: 1 1 0; min-width: 0; background: var(--soft); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px; display: flex; flex-direction: column; gap: 7px;
  }
  .backlog-col-head {
    display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    color: #6f6f68; padding: 2px 2px 4px;
  }
  .backlog-col-head .n { margin-left: auto; font-weight: 500; color: var(--muted); }
  .backlog-drop { display: flex; flex-direction: column; gap: 7px; min-height: 60px; border-radius: 9px; padding: 2px; }

  /* ---------- Сегодня: три равных дня ---------- */
  .today-container { display: flex; gap: 16px; align-items: stretch; }
  .today-col {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--line); padding-left: 16px;
  }
  .today-col:first-child { border-left: none; padding-left: 0; }
  .today-col-head {
    flex-shrink: 0; display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .today-col-head b { font-size: 15px; font-weight: 600; }
  .today-col-head span { font-size: 12px; color: var(--muted); }
  .today-col.is-today .today-col-head b { color: var(--accent); }
  .today-hours { min-width: 0; }
  .today-untimed { min-width: 0; flex-shrink: 0; margin-top: 12px; }
  .today-untimed h4 {
    font-size: 11px; color: var(--muted); font-weight: 600; margin: 0 0 7px;
    text-transform: uppercase; letter-spacing: .3px;
  }

  /* Дашборду прокрутка не нужна — плашки и диаграмма подгоняются под экран */
  body.global-dashboard .main { overflow: hidden; }
  body.global-dashboard .main-inner {
    height: 100%; display: flex; flex-direction: column; padding-bottom: 16px;
  }
  body.global-dashboard header { flex-shrink: 0; }
  body.global-dashboard #view-dashboard {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
  }
  body.global-dashboard .dash-tiles { flex-shrink: 0; }
  body.global-dashboard .dash-chart-head,
  body.global-dashboard .dash-legend { flex-shrink: 0; }
  body.global-dashboard .chart-nav { align-self: center; }

  /* Телефон: диаграмма растягивается на весь остаток. На широком экране
     этим управляет блок с раскладкой в две колонки, поэтому правила разведены. */
  @media (max-width: 767px) {
    body.global-dashboard .dash-section {
      flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 0;
    }
    body.global-dashboard .dash-chart-wrap { flex: 1; min-height: 120px; align-items: stretch; }
    body.global-dashboard .dash-chart { height: 100%; }
  }

  /* На широком экране колонки прокручиваются независимо друг от друга */
  @media (min-width: 1001px) {
    body.view-today .main { overflow: hidden; }
    body.view-today .main-inner { height: 100%; display: flex; flex-direction: column; padding-bottom: 16px; }
    body.view-today header, body.view-today .add-card { flex-shrink: 0; }
    body.view-today #view-today { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .today-container { flex: 1; min-height: 0; }
    /* Прокручивается колонка целиком, а не только часы: тогда список задач
       без времени идёт сразу под строкой 19:00, а не прижимается к низу экрана. */
    .today-col { min-height: 0; overflow-y: auto; }
    .today-hours { flex: 0 0 auto; }
    .today-untimed { flex: 0 0 auto; }
    /* заголовок дня остаётся на месте при прокрутке */
    .today-col-head {
      position: sticky; top: 0; z-index: 2; background: var(--panel); margin-bottom: 10px;
    }
  }
  .today-drop { display: flex; flex-direction: column; gap: 7px; min-height: 46px; border-radius: 9px; padding: 3px; }
  .hour-row { display: flex; gap: 12px; border-top: 1px solid var(--line); padding: 3px 0; }
  .hour-row:last-child { border-bottom: 1px solid var(--line); }
  .hour-label { width: 52px; flex-shrink: 0; font-size: 12px; color: var(--muted); padding-top: 2px; font-weight: 500; }
  .hour-row.is-now .hour-label { color: var(--red); font-weight: 700; }
  .hour-row.is-now { background: #fffaf9; }
  .hour-slot { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 21px; border-radius: 8px; padding: 2px 3px; }

  /* ---------- Дашборд ---------- */
  .dash-tiles { display: flex; gap: 12px; margin: 16px 0 24px; flex-wrap: wrap; }
  .dash-tile {
    flex: 1 1 150px; background: var(--soft); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .dash-tile .k { font-size: 13px; color: var(--muted); }
  .dash-tile .v { margin-left: auto; font-size: 19px; font-weight: 600; line-height: 1.2; }
  .dash-tile.warn .v { color: var(--red); }

  .dash-chart-head { display: flex; align-items: center; gap: 12px; }
  .dash-chart-head h3 { margin: 0; }
  #dash-week-now {
    display: none; border: 1px solid var(--line); background: #fff; border-radius: 7px;
    height: 24px; padding: 0 9px; font-size: 12px; color: #55554f; cursor: pointer;
  }
  body.dash-other-week #dash-week-now { display: inline-flex; align-items: center; }

  .dash-chart-wrap { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .chart-nav {
    flex-shrink: 0; width: 28px; height: 46px; border: 1px solid var(--line);
    background: #fff; border-radius: 9px; cursor: pointer; font-size: 16px;
    color: #55554f; line-height: 1; padding: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .chart-nav:hover { background: var(--soft); }

  .dash-week { display: flex; align-items: stretch; gap: 10px; flex: 1; min-width: 0; }
  .dash-week.second { border-left: 1px solid var(--line); padding-left: 10px; }
  .dash-chart {
    flex: 1; min-width: 0; display: flex; align-items: stretch; gap: 10px; height: 220px;
    touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab;
    transition: transform .18s ease, opacity .15s ease; will-change: transform;
  }
  .dash-chart.dragging { cursor: grabbing; transition: none; }
  .dash-bar-col {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
    min-width: 0; padding: 4px 2px; border-radius: 10px;
  }
  .dash-bar-v { font-size: 13px; font-weight: 600; }
  .dash-bar-col.zero .dash-bar-v { color: #c4c4c0; font-weight: 500; }
  .dash-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .dash-bar {
    width: 100%; max-width: 56px; display: flex; flex-direction: column; gap: 2px;
  }
  .dash-bar.empty { height: 3px; background: var(--line); border-radius: 2px; }
  .dash-seg { flex: 1; min-height: 3px; border-radius: 3px; }
  .dash-seg.high { background: var(--red); }
  .dash-seg.normal { background: var(--amber); }
  .dash-seg.low { background: #c3c3bd; }
  .dash-legend { display: flex; gap: 16px; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  .dash-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dash-bar-lab {
    font-size: 12px; color: var(--muted); white-space: nowrap;
    display: flex; gap: 4px; justify-content: center;
  }

  /* сегодняшний день: подложка под колонкой и подпись плашкой */
  .dash-bar-col.is-today { background: rgba(0, 113, 227, .08); }
  .dash-bar-col.is-today .dash-bar-v { color: var(--accent); }
  .dash-bar-col.is-today .dash-bar-lab {
    background: var(--accent); color: #fff; font-weight: 600;
    padding: 1px 8px; border-radius: 999px;
  }
  .dash-section { margin-bottom: 26px; }
  .dash-section h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
  .dash-day { font-size: 12px; color: var(--muted); font-weight: 600; margin: 14px 0 7px; }
  .dash-day:first-child { margin-top: 0; }
  .dash-list { display: flex; flex-direction: column; gap: 7px; }

  /* Телефон: плашки в одну строку, диаграмма компактнее.
     Блок обязан идти ПОСЛЕ основных стилей дашборда — медиазапрос
     не повышает приоритет, решает порядок в файле. */
  @media (max-width: 860px) {
    .dash-tiles { gap: 8px; flex-wrap: nowrap; margin: 12px 0 18px; }
    .dash-tile { flex: 1 1 0; min-width: 0; padding: 10px 9px; }
    .dash-tile .v { font-size: 22px; }
    .dash-tile .k { font-size: 11px; gap: 5px; white-space: nowrap; overflow: hidden; }
    .dash-tile .k .dot { width: 6px; height: 6px; }
    .dash-chart-wrap { gap: 2px; }
    .chart-nav { width: 22px; height: 40px; font-size: 15px; }
    .dash-chart { gap: 3px; height: 190px; }
    .dash-bar { max-width: 22px; }
    .dash-bar-col { padding: 4px 0; }
    .dash-bar-v { font-size: 11px; }
    /* место под большую кнопку записи + диаграмма компактнее */
    body.global-dashboard .main-inner { padding-bottom: 132px; }
    body.global-dashboard .dash-chart-wrap {
      flex: 0 1 auto; height: clamp(150px, 30vh, 250px); min-height: 0;
    }
    .dash-bar-lab { font-size: 10px; flex-direction: column; gap: 0; line-height: 1.15; }
    .dash-bar-col.is-today .dash-bar-lab { padding: 1px 5px; }
  }

  /* ---------- Дашборд на планшете и компьютере ---------- */
  .dash-split { display: block; }
  .dash-right { display: none; }

  @media (min-width: 768px) {
    .dash-tiles { flex-wrap: nowrap; margin: 12px 0 14px; }

    .dash-split {
      display: grid; grid-template-columns: minmax(230px, 27%) 1fr; gap: 0;
      flex: 1; min-height: 0;
    }
    .dash-left {
      display: flex; flex-direction: column; min-height: 0;
      padding-right: 18px; border-right: 1px solid var(--line);
    }
    .dash-right {
      display: flex; flex-direction: column; min-height: 0; padding-left: 18px;
    }

    /* две недели одна под другой, столбики ниже */
    .dash-left .dash-chart { flex-direction: column; height: auto; gap: 12px; }
    .dash-left .dash-week { flex: 0 0 auto; height: 76px; gap: 4px; }
    .dash-left .dash-week.second { border-left: none; padding-left: 0; }
    .dash-left .dash-bar { max-width: 20px; }
    .dash-left .dash-bar-col { gap: 3px; padding: 2px 0; }
    .dash-left .dash-bar-v { font-size: 10px; }
    .dash-left .dash-bar-lab { font-size: 10px; gap: 3px; }
    .dash-left .dash-legend { font-size: 11px; gap: 12px; margin-bottom: 8px; }
    .dash-left .dash-chart-head h3 { font-size: 12px; }
    .dash-left .dash-section { flex: 0 0 auto; margin-bottom: 14px; }
    .dash-left .dash-chart-wrap { flex: 0 0 auto; height: auto; }

    /* таблица задач */
    .dash-table-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .dash-table-head h3 { font-size: 13px; font-weight: 600; margin: 0; }
    .dash-table-count { font-size: 12px; color: var(--muted); }
    .dash-table-wrap { flex: 1; min-height: 0; overflow-y: auto; }
    .dash-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .dash-table thead th {
      position: sticky; top: 0; background: var(--panel); z-index: 1;
      text-align: left; font-size: 12px; font-weight: 600; color: var(--muted);
      padding: 0 10px 8px; border-bottom: 1px solid var(--line);
    }
    .dash-table td { padding: 9px 10px; border-bottom: 1px solid #f0f0ec; }
    .dash-table tbody tr { cursor: pointer; }
    .dash-table tbody tr:hover { background: var(--soft); }
    .dash-table .c-dot { width: 22px; padding-right: 0; }
    .dash-table .c-title { overflow: hidden; text-overflow: ellipsis; }
    .dash-table .c-title.urgent { color: var(--red); }
    .dash-table .c-proj { width: 28%; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dash-table .c-due { width: 22%; color: var(--muted); white-space: nowrap; }
    .dash-table .c-due.overdue { color: var(--red); font-weight: 600; }
    .dash-table-empty { color: var(--muted); padding: 18px 10px; }
  }

  /* ---------- Протоколы и заметки ---------- */
  .entry-add { margin: 14px 0 12px; }
  .entry-card {
    background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 14px;
    margin-bottom: 8px; cursor: pointer;
  }
  .entry-date { font-size: 12px; color: var(--muted); }
  .entry-title { font-weight: 600; font-size: 15px; margin: 4px 0 5px; }
  .entry-who { font-size: 12px; color: #6f6f68; margin-bottom: 5px; }
  .entry-snippet {
    font-size: 13px; color: #6f6f68; line-height: 1.5; white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  #entry-text { min-height: 190px; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3);
    z-index: 1000; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: var(--panel); border-radius: 18px; max-width: 540px; width: 100%; max-height: 85vh;
    overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.15);
  }
  .modal-header {
    padding: 22px 28px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .modal-close { border: none; background: none; font-size: 28px; color: var(--muted); cursor: pointer; padding: 0; line-height: 1; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { color: var(--ink); background: var(--soft); border-radius: 8px; }
  .modal-body { padding: 28px; }
  .modal-field { margin-bottom: 20px; }
  .modal-field label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 8px; font-weight: 600; }
  .modal-field textarea, .modal-field input[type=text], .modal-field input[type=date], .modal-field input[type=time], .modal-field select {
    width: 100%; min-width: 0; max-width: 100%; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--soft);
  }
  .modal-row .modal-field input[type=date], .modal-row .modal-field input[type=time],
  .modal-row .modal-field select { padding: 12px 10px; font-size: 15px; }
  .modal-field textarea:focus, .modal-field input[type=text]:focus, .modal-field input[type=date]:focus, .modal-field input[type=time]:focus, .modal-field select:focus {
    outline: none; border-color: var(--accent); background: #fff;
  }
  .modal-field textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
  .modal-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .modal-row .modal-field { flex: 1 1 130px; min-width: 0; }
  .check-row {
    display: flex; align-items: center; gap: 12px; font-size: 15px; cursor: pointer;
    padding: 14px; background: var(--soft); border-radius: 12px; margin-bottom: 20px;
  }
  .check-row input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .modal-actions { display: flex; gap: 12px; }
  .modal-actions button { padding: 12px 24px; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 500; }
  .btn-delete { background: #ffebee; color: var(--red); flex: 0 0 auto; }
  .btn-delete:hover { background: #ffcdd2; }
  .btn-save { background: var(--accent); color: #fff; flex: 1; }
  .btn-save:hover { background: #0056b3; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    :root { --gutter: 20px; }
    #app { flex-direction: column; }
    .sidebar {
      width: 100%; flex-direction: row; align-items: center; gap: 8px;
      padding: 10px 14px; border-right: none; border-bottom: 1px solid var(--line);
      overflow-x: auto; flex-shrink: 0;
    }
    .sidebar .logo { padding: 0 6px 0 0; gap: 7px; }
    .sidebar .logo-text span { display: none; }
    .sidebar-header { display: none; }
    .sidebar-nav { flex-direction: row; gap: 4px; padding: 0; border: none; flex-shrink: 0; }
    .nav-btn { width: auto; padding: 7px 10px; white-space: nowrap; background: var(--soft); }
    .sidebar-projects { flex-direction: row; flex: 0 0 auto; gap: 4px; overflow: visible; }
    .proj { width: auto; white-space: nowrap; padding: 9px 10px; background: var(--soft); font-size: 14px; }
    .proj-switch { width: 26px; height: 16px; }
    .proj-switch::after { width: 12px; height: 12px; }
    .proj-switch.on::after { transform: translateX(10px); }
    .proj-edit { display: none; }
    .sidebar-add { border: none; margin: 0; padding: 0; flex-shrink: 0; }
    .sidebar-footer { border: none; margin: 0; padding: 0; flex-shrink: 0; }
    #save-indicator { display: none; }
    #logout-btn { width: auto; padding: 10px 12px; white-space: nowrap; font-size: 14px; }
    #voice-reply-btn { width: auto; padding: 10px 12px; white-space: nowrap; font-size: 14px; }
    .sidebar-add button { padding: 10px 12px; white-space: nowrap; font-size: 14px; }
    .main-inner { padding: 0 var(--gutter) 110px; }
    header { flex-direction: column; align-items: flex-start; gap: 8px; padding-bottom: 0; margin-bottom: 0; }
    header h1 { font-size: 24px; margin-bottom: 0; flex: 0 0 auto; max-width: 100%; }
    .view-tabs { gap: 2px; padding-bottom: 0; width: 100%; }
    .vtab { padding: 9px 12px; font-size: 13px; top: 0; }
    .vtab.active { top: 0; }
    .week-col { min-width: 190px; flex: 0 0 auto; }
  }
  @media (max-width: 1000px) {
    .today-container { flex-direction: column; gap: 18px; }
    .today-col { border-left: none; padding-left: 0; }
  }
  @media (max-width: 860px) {
    .add-card { flex-wrap: wrap; gap: 8px; }
    .add-title, .add-desc { flex: 1 1 100%; }
    .add-row { width: 100%; gap: 8px; }
  }
  @media (max-width: 520px) {
    .btn-add { flex: 1; }
    .btn-icon { width: 44px; height: 44px; }
    #voice-btn { width: 48px; height: 44px; font-size: 25px; }
  }
</style>
</head>
<body>

<div id="login-page">
  <div class="login-box">
    <div class="login-logo">ВЕКТОР</div>
    <h1>Задачник</h1>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com"
        onkeydown="if(event.key==='Enter')document.getElementById('login-password').focus()">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="login-password" placeholder="••••••••"
