<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачник — ВЕКТОР</title>
<meta name="theme-color" content="#f5f5f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Задачник">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a18'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f5f5f3;
    --panel: #ffffff;
    --line: #e6e6e2;
    --ink: #1a1a18;
    --muted: #8a8a84;
    --soft: #fafaf8;
    --red: #c0392b;
    --amber: #b8860b;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; }

  /* ---------- Login ---------- */
  #login-page {
    display: flex; align-items: center; justify-content: center;
    height: 100%; background: var(--bg);
  }
  body.authed #login-page { display: none; }
  .login-box {
    width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  .login-logo { font-size: 12px; font-weight: 800; letter-spacing: 3px; text-align: center; color: var(--ink); }
  .login-box h1 { font-size: 19px; margin: 8px 0 22px; text-align: center; font-weight: 600; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; font-size: 15px; padding: 11px 13px;
    border: 1px solid #ddd; border-radius: 9px; background: #fff; color: var(--ink);
  }
  .field input:focus { outline: none; border-color: #bbb; }
  .btn-primary {
    width: 100%; padding: 12px; border: none; background: var(--ink); color: #fff;
    border-radius: 9px; font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .btn-primary:hover { background: #333; }
  .link-btn {
    width: 100%; margin-top: 12px; padding: 8px; border: none; background: none;
    color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline;
  }
  #login-error {
    margin-top: 14px; padding: 11px; border-radius: 9px; background: #fdf0f0;
    color: #a33020; font-size: 13px; display: none;
  }

  /* ---------- App shell ---------- */
  #app { display: none; height: 100%; }
  body.authed #app { display: flex; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--soft); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 22px 14px 16px;
  }
  .sidebar .logo { padding: 0 10px 20px; line-height: 1.3; }
  .sidebar .logo b { display: block; font-size: 13px; font-weight: 800; letter-spacing: 3px; }
  .sidebar .logo span { font-size: 12px; color: var(--muted); letter-spacing: .2px; }
  .sidebar-header {
    font-size: 11px; color: #a8a8a2; text-transform: uppercase; letter-spacing: 1px;
    font-weight: 700; padding: 0 10px; margin-bottom: 8px;
  }
  .sidebar-projects { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .proj {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    border: none; background: none; border-radius: 9px; cursor: pointer;
    font-size: 14px; color: #5f5f59; text-align: left;
  }
  .proj.active { background: var(--ink); color: #fff; font-weight: 600; }
  .proj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-count {
    font-size: 11px; color: #9a9a94; background: #eaeae6; border-radius: 10px;
    padding: 2px 7px; flex-shrink: 0;
  }
  .proj.active .proj-count { background: rgba(255,255,255,.2); color: #fff; }
  .proj-edit {
    border: none; background: none; color: inherit; cursor: pointer; font-size: 13px;
    padding: 2px 4px; opacity: .4; flex-shrink: 0;
  }
  .proj.active .proj-edit { opacity: .65; }
  .proj-drag {
    flex-shrink: 0; cursor: grab; font-size: 12px; line-height: 1; padding: 3px 1px;
    color: inherit; opacity: .3; letter-spacing: -1px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .proj.active .proj-drag { opacity: .6; }
  .proj.dragging {
    opacity: .75; background: #e6e6e1; box-shadow: 0 3px 10px rgba(0,0,0,.12);
  }
  .proj.dragging .proj-drag { cursor: grabbing; }
  .proj:active { background: #e6e6e1; }
  .proj.active:active { background: var(--ink); }

  /* Hover-эффекты только для мыши. На тач-экранах :hover «залипает»:
     первое касание отрабатывает как наведение, и клик срабатывает лишь со второго раза. */
  @media (hover: hover) and (pointer: fine) {
    .proj:hover { background: #efefeb; }
    .proj.active:hover { background: var(--ink); }
    .proj-edit { opacity: 0; }
    .proj:hover .proj-edit, .proj.active .proj-edit { opacity: .55; }
    .proj-edit:hover { opacity: 1 !important; }
    .task-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .btn-icon:hover { background: #f7f7f5; }
    .sidebar-add button:hover { border-color: #a8a8a2; color: #55554f; }
    #logout-btn:hover { background: #ebebe7; color: var(--ink); }
  }
  .sidebar-add { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .sidebar-add button {
    width: 100%; padding: 10px; border: 1px dashed #c8c8c2; background: none;
    color: var(--muted); border-radius: 9px; font-size: 13px; cursor: pointer;
  }

  .sidebar-footer { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #logout-btn {
    width: 100%; padding: 9px 10px; border: none; background: none; border-radius: 9px;
    color: var(--muted); cursor: pointer; font-size: 13px; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #logout-btn:active { background: #ebebe7; }

  /* ---------- Main ---------- */
  .main { flex: 1; overflow-y: auto; }
  .main-inner { max-width: 720px; margin: 0 auto; padding: 30px 26px 110px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 25px; margin: 0; letter-spacing: -.4px; }
  .header-right { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
  #save-indicator { min-width: 100px; text-align: right; font-size: 12px; }

  .stats { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .stats .overdue-count { color: var(--red); font-weight: 600; }

  /* ---------- Add task ---------- */
  .add-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin: 20px 0 18px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .add-title {
    width: 100%; border: none; outline: none; font-size: 15px; padding: 6px 4px; background: none;
  }
  .add-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .add-row input[type=date], .add-row select {
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
    font-size: 13px; color: #55554f; background: #fff;
  }
  .add-row .spacer { flex: 1; }
  .btn-icon {
    width: 40px; height: 40px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  .btn-icon.listening { background: var(--red); border-color: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
  .btn-add {
    border: none; background: var(--ink); color: #fff; border-radius: 8px;
    padding: 11px 20px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .btn-add:hover { background: #333; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: inline-flex; gap: 2px; background: #ececea; padding: 3px;
    border-radius: 10px; margin-bottom: 16px;
  }
  .tab {
    border: none; background: none; color: #7a7a74; font-size: 13px;
    padding: 7px 15px; border-radius: 8px; cursor: pointer;
  }
  .tab.active { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* ---------- Task list ---------- */
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-row {
    display: flex; align-items: flex-start; gap: 12px; background: var(--panel);
    border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: 10px;
    padding: 14px; cursor: pointer; transition: box-shadow .12s;
  }
  .task-row.overdue { border-left-color: var(--red); }
  .task-row.due-today { border-left-color: var(--amber); }
  .task-row.done { opacity: .5; }
  .task-checkbox {
    width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--ink);
    cursor: pointer; flex-shrink: 0;
  }
  .task-main { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; line-height: 1.35; }
  .task-row.done .task-title { text-decoration: line-through; }
  .task-desc {
    font-size: 13px; color: var(--muted); margin-top: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task-meta { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 20px; background: #f1f1ed;
    color: #6e6e68; display: inline-flex; align-items: center; gap: 5px;
  }
  .pill.overdue { background: #fdeeec; color: var(--red); font-weight: 600; }
  .pill.today { background: #fbf3e2; color: #96690f; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.high { background: var(--red); }
  .dot.normal { background: var(--amber); }
  .dot.low { background: #c3c3bd; }
  .task-del {
    border: none; background: none; color: #c9c9c3; font-size: 19px; line-height: 1;
    cursor: pointer; padding: 0 2px; flex-shrink: 0;
  }
  .task-del:hover { color: var(--red); }
  .empty-state { text-align: center; color: #b0b0aa; font-size: 14px; padding: 56px 20px; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(26,26,24,.35);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; max-width: 520px; width: 100%; max-height: 85vh;
    overflow-y: auto; box-shadow: 0 8px 28px rgba(0,0,0,.18);
  }
  .modal-header {
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .modal-close { border: none; background: none; font-size: 26px; color: #b0b0aa; cursor: pointer; padding: 0; line-height: 1; }
  .modal-close:hover { color: var(--ink); }
  .modal-body { padding: 22px; }
  .modal-field { margin-bottom: 18px; }
  .modal-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
  .modal-field textarea, .modal-field input[type=text], .modal-field input[type=date], .modal-field select {
    width: 100%; font-size: 15px; padding: 11px; border: 1px solid #ddd; border-radius: 9px;
  }
  .modal-field textarea { resize: vertical; min-height: 92px; line-height: 1.45; }
  .modal-row { display: flex; gap: 12px; }
  .modal-row .modal-field { flex: 1; }
  .check-row {
    display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer;
    padding: 12px; background: var(--soft); border-radius: 9px; margin-bottom: 18px;
  }
  .check-row input { width: 18px; height: 18px; accent-color: var(--ink); cursor: pointer; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { padding: 12px; border: none; border-radius: 9px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-delete { background: #fdf0f0; color: var(--red); flex: 0 0 auto; padding-left: 20px; padding-right: 20px; }
  .btn-delete:hover { background: #fbe3e3; }
  .btn-save { background: var(--ink); color: #fff; flex: 1; }
  .btn-save:hover { background: #333; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    #app { flex-direction: column; }
    .sidebar {
      width: 100%; flex-direction: row; align-items: center; gap: 8px;
      padding: 10px 14px; border-right: none; border-bottom: 1px solid var(--line);
      overflow-x: auto; flex-shrink: 0;
    }
    .sidebar .logo { padding: 0 6px 0 0; }
    .sidebar .logo span { display: none; }
    .sidebar-header { display: none; }
    .sidebar-projects { flex-direction: row; flex: 0 0 auto; gap: 6px; overflow: visible; }
    .proj { width: auto; white-space: nowrap; padding: 9px 14px; background: #ebebe7; }
    .proj-edit { display: none; }
    .sidebar-add { border: none; margin: 0; padding: 0; flex-shrink: 0; }
    .sidebar-footer { border: none; margin: 0; padding: 0; flex-shrink: 0; }
    #logout-btn { width: auto; padding: 9px 12px; white-space: nowrap; }
    .sidebar-add button { padding: 9px 14px; white-space: nowrap; }
    .main-inner { padding: 22px 16px 110px; }
    header h1 { font-size: 21px; }
  }
  @media (max-width: 520px) {
    .btn-add { flex: 1; padding: 13px; }
    .btn-icon { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<div id="login-page">
  <div class="login-box">
    <div class="login-logo">ВЕКТОР</div>
    <h1>Задачник</h1>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com"
        onkeydown="if(event.key==='Enter')document.getElementById('login-password').focus()">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="login-password" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')handleLogin()">
    </div>
    <button class="btn-primary" onclick="handleLogin()">Войти</button>
    <button class="link-btn" onclick="handleRegister()">Первый раз здесь — зарегистрироваться</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="logo"><b>ВЕКТОР</b><span>Задачник</span></div>
    <div class="sidebar-header">Проекты</div>
    <div class="sidebar-projects" id="projects-list"></div>
    <div class="sidebar-add">
      <button onclick="addProject()">+ Новый проект</button>
    </div>
    <div class="sidebar-footer">
      <button id="logout-btn" onclick="handleLogout()">Выйти</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <header>
        <h1 id="project-title">Задачник</h1>
        <div class="header-right">
          <span id="save-indicator"></span>
        </div>
      </header>
      <div class="stats" id="stats"></div>

      <div class="add-card">
        <input type="text" class="add-title" id="new-title" placeholder="Что нужно сделать?"
          onkeydown="if(event.key==='Enter')addTask()">
        <div class="add-row">
          <input type="date" id="new-due" title="Срок">
          <select id="new-priority" title="Важность">
            <option value="normal" selected>Обычный</option>
            <option value="high">Высокий</option>
            <option value="low">Низкий</option>
          </select>
          <span class="spacer"></span>
          <button class="btn-icon" id="voice-btn" onclick="toggleVoice()" title="Диктовать задачу">🎤</button>
          <button class="btn-add" onclick="addTask()">Добавить</button>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="active" onclick="setFilter('active')">Активные</button>
        <button class="tab" data-filter="done" onclick="setFilter('done')">Завершённые</button>
        <button class="tab" data-filter="all" onclick="setFilter('all')">Все</button>
      </div>

      <div class="task-list" id="task-list"></div>
    </div>
  </main>

  <!-- Task detail modal -->
  <div class="modal-overlay" id="task-modal" onclick="if(event.target.id==='task-modal')closeTaskModal()">
    <div class="modal">
      <div class="modal-header">
        <h2>Задача</h2>
        <button class="modal-close" onclick="closeTaskModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Название</label>
          <input type="text" id="task-title-input" placeholder="Название задачи">
        </div>
        <div class="modal-field">
          <label>Описание</label>
          <textarea id="task-desc-input" placeholder="Подробности, контакты, что именно сделать…"></textarea>
        </div>
        <div class="modal-row">
          <div class="modal-field">
            <label>Срок</label>
            <input type="date" id="task-due-input">
          </div>
          <div class="modal-field">
            <label>Важность</label>
            <select id="task-prio-input">
              <option value="high">Высокий</option>
              <option value="normal">Обычный</option>
              <option value="low">Низкий</option>
            </select>
          </div>
        </div>
        <div class="modal-field">
          <label>Проект</label>
          <select id="task-project-input"></select>
        </div>
        <label class="check-row">
          <input type="checkbox" id="task-done-input"> Задача выполнена
        </label>
        <div class="modal-actions">
          <button class="btn-delete" onclick="deleteCurrentTask()">Удалить</button>
          <button class="btn-save" onclick="saveTaskModal()">Сохранить</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var VER = '10.12.0';
  var scripts = [
    'https://www.gstatic.com/firebasejs/' + VER + '/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/' + VER + '/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/' + VER + '/firebase-firestore-compat.js'
  ];
  function loadNext(i) {
    if (i >= scripts.length) { initFirebase(); return; }
    var s = document.createElement('script');
    s.src = scripts[i];
    s.onload = function() { loadNext(i + 1); };
    s.onerror = function() { console.error('Failed to load Firebase script:', scripts[i]); loadNext(i + 1); };
    document.head.appendChild(s);
  }
  loadNext(0);
})();

var tasks = [];
var projects = [];
var currentProject = null;
var filter = 'active';
var firebaseUid = null;
var recognition = null;
var isListening = false;
var currentTaskId = null;

// Инициализация Web Speech API
if (typeof webkitSpeechRecognition !== 'undefined') {
  recognition = new webkitSpeechRecognition();
  recognition.lang = 'ru-RU';
  recognition.continuous = false;
  recognition.onstart = function() {
    isListening = true;
    document.getElementById('voice-btn').classList.add('listening');
  };
  recognition.onend = function() {
    isListening = false;
    document.getElementById('voice-btn').classList.remove('listening');
  };
  recognition.onerror = function(e) {
    console.error('Speech recognition error:', e.error);
    document.getElementById('voice-btn').classList.remove('listening');
    alert('Ошибка распознавания речи: ' + e.error);
  };
  recognition.onresult = function(e) {
    var transcript = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    var titleEl = document.getElementById('new-title');
    titleEl.value = (titleEl.value.trim() + ' ' + transcript.trim()).trim();
    titleEl.focus();
    addTask();
  };
}

function initFirebase() {
  firebase.initializeApp({
    apiKey: "AIzaSyDXkHVg3ucKGiG6QF3SFxds7MuTJ95Wx60",
    authDomain: "bdds-1.firebaseapp.com",
    projectId: "bdds-1",
    storageBucket: "bdds-1.firebasestorage.app",
    messagingSenderId: "94953276486",
    appId: "1:94953276486:web:5c211765490485a9cd7647"
  });
  window.db = firebase.firestore();
  window.auth = firebase.auth();

  var _unsubAuth = window.auth.onAuthStateChanged(function(user) {
    _unsubAuth();
    if (user) {
      firebaseUid = user.uid;
      loadTasks().then(showApp);
    } else {
      showLogin();
    }
  });
}

function _lsKey() { return firebaseUid ? ('tasks_cache_' + firebaseUid) : 'tasks_cache'; }

function loadTasks() {
  return new Promise(function(resolve) {
    var lsData = null;
    try {
      var raw = localStorage.getItem(_lsKey());
      if (raw) lsData = JSON.parse(raw);
    } catch(e) {}
    var lsValid = lsData && Array.isArray(lsData.tasks);

    function apply(d) {
      tasks = (d && Array.isArray(d.tasks)) ? d.tasks : [];
      projects = (d && Array.isArray(d.projects)) ? d.projects : [];
      if (projects.length === 0) {
        projects = [{id: 'default', name: 'Основное'}];
      }
      currentProject = projects[0].id;
    }

    var settled = false;
    var timer = setTimeout(function() {
      if (settled) return;
      settled = true;
      apply(lsData);
      resolve();
    }, 6000);

    window.db.doc('tasks/' + firebaseUid).get()
      .then(function(snap) {
        var fbData = snap.exists ? snap.data() : null;
        var fbValid = fbData && Array.isArray(fbData.tasks);
        var d = null;
        if (fbValid && lsValid) {
          d = (lsData.updatedAt || 0) > (fbData.updatedAt || 0) ? lsData : fbData;
        } else if (fbValid) {
          d = fbData;
        } else if (lsValid) {
          d = lsData;
        }
        if (settled) return;
        settled = true; clearTimeout(timer);
        apply(d);
        resolve();
      })
      .catch(function(e) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        console.error('[loadTasks] server error, fallback to localStorage:', e);
        apply(lsData);
        resolve();
      });
  });
}

var _saveTimer = null;
function _setSaveIndicator(state) {
  var el = document.getElementById('save-indicator');
  if (!el) return;
  if (state === 'saving') { el.textContent = '⏳ Сохранение…'; el.style.color = '#aaa'; }
  else if (state === 'saved') { el.textContent = '✓ Сохранено'; el.style.color = '#0a6e4e'; setTimeout(function(){ el.textContent=''; }, 2000); }
  else { el.textContent = '⚠ Ошибка сохранения'; el.style.color = '#c0392b'; }
}

function saveTasks() {
  var payload = { tasks: tasks, projects: projects, currentProject: currentProject, updatedAt: Date.now() };
  try { localStorage.setItem(_lsKey(), JSON.stringify(payload)); } catch(e) {}
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function() {
    if (!firebaseUid) return;
    _setSaveIndicator('saving');
    window.db.doc('tasks/' + firebaseUid).set(payload)
      .then(function() { _setSaveIndicator('saved'); })
      .catch(function(e) { console.error('Save error:', e); _setSaveIndicator('error'); });
  }, 500);
}

/* ---------- Auth ---------- */
function showLoginError(msg) {
  var el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideLoginError() {
  document.getElementById('login-error').style.display = 'none';
}

function handleLogin() {
  hideLoginError();
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;
  if (!email || !password) { showLoginError('Введите email и пароль'); return; }
  window.auth.signInWithEmailAndPassword(email, password)
    .catch(function(e) { showLoginError(translateAuthError(e)); });
}

function handleRegister() {
  hideLoginError();
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;
  if (!email || !password) { showLoginError('Введите email и пароль'); return; }
  if (password.length < 6) { showLoginError('Пароль должен быть не короче 6 символов'); return; }
  window.auth.createUserWithEmailAndPassword(email, password)
    .catch(function(e) { showLoginError(translateAuthError(e)); });
}

function handleLogout() {
  window.auth.signOut().then(function() {
    tasks = [];
    firebaseUid = null;
  });
}

function translateAuthError(e) {
  var code = e && e.code;
  if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Неверный email или пароль';
  if (code === 'auth/user-not-found') return 'Пользователь не найден';
  if (code === 'auth/email-already-in-use') return 'Этот email уже зарегистрирован — просто войдите';
  if (code === 'auth/invalid-email') return 'Некорректный email';
  if (code === 'auth/weak-password') return 'Пароль слишком простой';
  return 'Ошибка: ' + (e && e.message ? e.message : e);
}

function showLogin() {
  document.body.classList.remove('authed');
}
function showApp() {
  document.body.classList.add('authed');
  render();
}

/* ---------- Task operations ---------- */
function addTask() {
  var titleEl = document.getElementById('new-title');
  var title = titleEl.value.trim();
  if (!title) return;
  var due = document.getElementById('new-due').value || null;
  var priority = document.getElementById('new-priority').value;
  tasks.push({
    id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    title: title,
    description: '',
    projectId: currentProject,
    done: false,
    priority: priority,
    due: due,
    createdAt: Date.now(),
    doneAt: null
  });
  titleEl.value = '';
  document.getElementById('new-due').value = '';
  document.getElementById('new-priority').value = 'normal';
  titleEl.focus();
  saveTasks();
  render();
}

function selectProject(id) {
  currentProject = id;
  saveTasks();
  render();
}

/* ---------- Перетаскивание проектов в левом меню ---------- */
var _projDrag = null;
var _projDragMoved = false;

function projDragStart(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  var row = e.currentTarget.parentNode;
  var list = document.getElementById('projects-list');
  _projDrag = {
    row: row,
    list: list,
    horizontal: getComputedStyle(list).flexDirection === 'row',
    moved: false
  };
  _projDragMoved = false;
  row.classList.add('dragging');
  try { list.setPointerCapture(e.pointerId); } catch (_) {}
  list.addEventListener('pointermove', projDragMove);
  list.addEventListener('pointerup', projDragEnd);
  list.addEventListener('pointercancel', projDragEnd);
}

function projDragMove(e) {
  var d = _projDrag;
  if (!d) return;
  e.preventDefault();
  d.moved = true;
  var pos = d.horizontal ? e.clientX : e.clientY;
  var others = Array.prototype.filter.call(
    d.list.querySelectorAll('.proj'),
    function(r) { return r !== d.row; }
  );
  var before = null;
  for (var i = 0; i < others.length; i++) {
    var b = others[i].getBoundingClientRect();
    var mid = d.horizontal ? b.left + b.width / 2 : b.top + b.height / 2;
    if (pos < mid) { before = others[i]; break; }
  }
  if (before) d.list.insertBefore(d.row, before);
  else d.list.appendChild(d.row);
}

function projDragEnd(e) {
  var d = _projDrag;
  if (!d) return;
  _projDrag = null;
  d.row.classList.remove('dragging');
  d.list.removeEventListener('pointermove', projDragMove);
  d.list.removeEventListener('pointerup', projDragEnd);
  d.list.removeEventListener('pointercancel', projDragEnd);
  try { d.list.releasePointerCapture(e.pointerId); } catch (_) {}
  if (!d.moved) return;

  // гасим клик, который браузер пошлёт строке сразу после перетаскивания
  _projDragMoved = true;
  setTimeout(function() { _projDragMoved = false; }, 0);

  var order = Array.prototype.map.call(d.list.querySelectorAll('.proj'),
    function(r) { return r.dataset.id; });
  var ordered = [];
  order.forEach(function(id) {
    var p = projects.find(function(x) { return x.id === id; });
    if (p && ordered.indexOf(p) === -1) ordered.push(p);
  });
  projects.forEach(function(p) { if (ordered.indexOf(p) === -1) ordered.push(p); });
  projects = ordered;
  saveTasks();
  render();
}

function addProject() {
  var name = prompt('Название проекта:');
  if (!name || !name.trim()) return;
  projects.push({ id: 'p_' + Date.now(), name: name.trim() });
  currentProject = projects[projects.length - 1].id;
  saveTasks();
  render();
}

function renameProject(id) {
  var p = projects.find(function(x) { return x.id === id; });
  if (!p) return;
  var name = prompt('Название проекта (очистите поле, чтобы удалить проект):', p.name);
  if (name === null) return;
  if (!name.trim()) {
    if (projects.length === 1) { alert('Нельзя удалить единственный проект'); return; }
    var n = tasks.filter(function(t) { return t.projectId === id; }).length;
    if (!confirm('Удалить проект «' + p.name + '»' + (n ? ' и ' + n + ' задач(и) в нём' : '') + '?')) return;
    tasks = tasks.filter(function(t) { return t.projectId !== id; });
    projects = projects.filter(function(x) { return x.id !== id; });
    if (currentProject === id) currentProject = projects[0].id;
  } else {
    p.name = name.trim();
  }
  saveTasks();
  render();
}

function toggleDone(id) {
  var t = tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  saveTasks();
  render();
}

function deleteTask(id) {
  tasks = tasks.filter(function(x) { return x.id !== id; });
  saveTasks();
  render();
}

function setFilter(f) {
  filter = f;
  render();
}

function toggleVoice() {
  if (!recognition) {
    alert('Голосовой ввод не поддерживается в вашем браузере');
    return;
  }
  if (isListening) {
    recognition.stop();
  } else {
    recognition.start();
  }
}

function openTaskModal(id) {
  var t = tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  currentTaskId = id;
  document.getElementById('task-title-input').value = t.title;
  document.getElementById('task-desc-input').value = t.description || '';
  document.getElementById('task-due-input').value = t.due || '';
  document.getElementById('task-prio-input').value = t.priority;
  document.getElementById('task-done-input').checked = t.done;

  var sel = document.getElementById('task-project-input');
  sel.innerHTML = '';
  projects.forEach(function(p) {
    var o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name;
    if (p.id === t.projectId) o.selected = true;
    sel.appendChild(o);
  });

  document.getElementById('task-modal').classList.add('visible');
  document.getElementById('task-title-input').focus();
}

function closeTaskModal() {
  currentTaskId = null;
  document.getElementById('task-modal').classList.remove('visible');
}

function saveTaskModal() {
  if (!currentTaskId) return;
  var t = tasks.find(function(x) { return x.id === currentTaskId; });
  if (!t) return;
  t.title = document.getElementById('task-title-input').value.trim() || t.title;
  t.description = document.getElementById('task-desc-input').value;
  t.due = document.getElementById('task-due-input').value || null;
  t.priority = document.getElementById('task-prio-input').value;
  t.projectId = document.getElementById('task-project-input').value || t.projectId;
  var wasDone = t.done;
  t.done = document.getElementById('task-done-input').checked;
  if (!wasDone && t.done) t.doneAt = Date.now();
  else if (wasDone && !t.done) t.doneAt = null;
  saveTasks();
  closeTaskModal();
  render();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeTaskModal();
});

function deleteCurrentTask() {
  if (!currentTaskId || !confirm('Удалить задачу?')) return;
  deleteTask(currentTaskId);
  closeTaskModal();
}

/* ---------- Rendering ---------- */
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatDue(due) {
  var parts = due.split('-');
  return parts[2] + '.' + parts[1] + '.' + parts[0].slice(2);
}

var prioRank = { high: 0, normal: 1, low: 2 };
var prioLabel = { high: 'Высокий', normal: 'Обычный', low: 'Низкий' };

function render() {
  // ---- Sidebar: projects with active-task counts ----
  var projList = document.getElementById('projects-list');
  projList.innerHTML = '';
  projects.forEach(function(p) {
    var row = document.createElement('button');
    row.className = 'proj' + (currentProject === p.id ? ' active' : '');
    row.dataset.id = p.id;
    row.onclick = function() { if (!_projDragMoved) selectProject(p.id); };

    var grip = document.createElement('span');
    grip.className = 'proj-drag';
    grip.textContent = '⠿';
    grip.title = 'Потяните, чтобы переставить проект';
    grip.addEventListener('pointerdown', projDragStart);
    grip.addEventListener('click', function(e) { e.stopPropagation(); e.preventDefault(); });
    row.appendChild(grip);

    var name = document.createElement('span');
    name.className = 'proj-name';
    name.textContent = p.name;
    row.appendChild(name);

    var n = tasks.filter(function(t) { return t.projectId === p.id && !t.done; }).length;
    if (n > 0) {
      var cnt = document.createElement('span');
      cnt.className = 'proj-count';
      cnt.textContent = n;
      row.appendChild(cnt);
    }

    var edit = document.createElement('span');
    edit.className = 'proj-edit';
    edit.textContent = '✎';
    edit.title = 'Переименовать или удалить';
    edit.onclick = function(e) { e.stopPropagation(); renameProject(p.id); };
    row.appendChild(edit);

    projList.appendChild(row);
  });

  // ---- Header: current project name ----
  var proj = projects.find(function(p) { return p.id === currentProject; });
  document.getElementById('project-title').textContent = proj ? proj.name : 'Задачник';

  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t) { t.classList.toggle('active', t.dataset.filter === filter); });

  var today = todayStr();
  var visible = tasks.filter(function(t) {
    if (t.projectId !== currentProject) return false;
    if (filter === 'active') return !t.done;
    if (filter === 'done') return t.done;
    return true;
  });

  visible.sort(function(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    if (prioRank[a.priority] !== prioRank[b.priority]) return prioRank[a.priority] - prioRank[b.priority];
    return a.createdAt - b.createdAt;
  });

  var listEl = document.getElementById('task-list');
  listEl.innerHTML = '';

  if (visible.length === 0) {
    var msg = filter === 'done' ? 'Завершённых задач пока нет'
            : filter === 'active' ? 'Активных задач нет — всё сделано'
            : 'В этом проекте пока нет задач';
    listEl.innerHTML = '<div class="empty-state">' + msg + '</div>';
  } else {
    visible.forEach(function(t) {
      var row = document.createElement('div');
      row.className = 'task-row' + (t.done ? ' done' : '');
      if (!t.done && t.due) {
        if (t.due < today) row.classList.add('overdue');
        else if (t.due === today) row.classList.add('due-today');
      }
      // Клик по всей карточке открывает детали
      row.onclick = function() { openTaskModal(t.id); };

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'task-checkbox';
      cb.checked = t.done;
      cb.onclick = function(e) { e.stopPropagation(); toggleDone(t.id); };
      row.appendChild(cb);

      var main = document.createElement('div');
      main.className = 'task-main';

      var title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = t.title;
      main.appendChild(title);

      if (t.description && t.description.trim()) {
        var desc = document.createElement('div');
        desc.className = 'task-desc';
        desc.textContent = t.description.trim().replace(/\s+/g, ' ');
        main.appendChild(desc);
      }

      var meta = document.createElement('div');
      meta.className = 'task-meta';

      var prio = document.createElement('span');
      prio.className = 'pill';
      var dot = document.createElement('span');
      dot.className = 'dot ' + t.priority;
      prio.appendChild(dot);
      prio.appendChild(document.createTextNode(prioLabel[t.priority] || 'Обычный'));
      meta.appendChild(prio);

      if (t.due) {
        var duePill = document.createElement('span');
        duePill.className = 'pill';
        var label = formatDue(t.due);
        if (!t.done && t.due < today) { duePill.className += ' overdue'; label = 'Просрочено · ' + label; }
        else if (!t.done && t.due === today) { duePill.className += ' today'; label = 'Сегодня'; }
        duePill.textContent = label;
        meta.appendChild(duePill);
      }

      main.appendChild(meta);
      row.appendChild(main);

      var del = document.createElement('button');
      del.className = 'task-del';
      del.textContent = '×';
      del.title = 'Удалить задачу';
      del.onclick = function(e) { e.stopPropagation(); deleteTask(t.id); };
      row.appendChild(del);

      listEl.appendChild(row);
    });
  }

  // ---- Stats for current project ----
  var mine = tasks.filter(function(t) { return t.projectId === currentProject; });
  var activeCount = mine.filter(function(t) { return !t.done; }).length;
  var overdueCount = mine.filter(function(t) { return !t.done && t.due && t.due < today; }).length;
  var todayCount = mine.filter(function(t) { return !t.done && t.due === today; }).length;
  var parts = ['Активных: ' + activeCount];
  if (todayCount > 0) parts.push('на сегодня: ' + todayCount);
  if (overdueCount > 0) parts.push('<span class="overdue-count">просрочено: ' + overdueCount + '</span>');
  document.getElementById('stats').innerHTML = parts.join(' · ');
}

</script>
