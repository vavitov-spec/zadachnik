<script>
(function() {
  var VER = '10.12.0';
  var scripts = [
    'https://www.gstatic.com/firebasejs/' + VER + '/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/' + VER + '/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/' + VER + '/firebase-firestore-compat.js'
  ];
  function loadNext(i) {
    if (i >= scripts.length) { initFirebase(); return; }
    var s = document.createElement('script');
    s.src = scripts[i];
    s.onload = function() { loadNext(i + 1); };
    s.onerror = function() { console.error('Failed to load Firebase script:', scripts[i]); loadNext(i + 1); };
    document.head.appendChild(s);
  }
  loadNext(0);
})();

var tasks = [];
var projects = [];
var currentProject = null;
var filter = 'active';
var currentView = 'list';          // today | week | list | protocols | notes
var globalView = 'dashboard';      // null — обычный проект; 'today' | 'dashboard' — сводные разделы
var weekOffset = 0;                // 0 — текущая неделя
var notes = [];
var protocols = [];
var firebaseUid = null;
var recognition = null;
var isListening = false;
var currentTaskId = null;

// Инициализация Web Speech API
var _voiceFinal = '';

// Состояние диктовки показываем на обеих кнопках сразу и текстом над большой кнопкой
function setVoiceStatus(state, text) {
  ['voice-btn', 'mic-fab'].forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('listening', state === 'listening');
    el.classList.toggle('processing', state === 'processing');
  });
  var hint = document.getElementById('mic-hint');
  if (!hint) return;
  hint.textContent = text || '';
  hint.classList.toggle('show', !!text);
}

if (typeof webkitSpeechRecognition !== 'undefined') {
  recognition = new webkitSpeechRecognition();
  recognition.lang = 'ru-RU';
  recognition.continuous = false;
  recognition.interimResults = true;   // чтобы показывать речь по ходу

  recognition.onstart = function() {
    isListening = true;
    _voiceFinal = '';
    setVoiceStatus('listening', 'Слушаю…');
  };

  recognition.onresult = function(e) {
    var interim = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var r = e.results[i];
      if (r.isFinal) _voiceFinal += r[0].transcript;
      else interim += r[0].transcript;
    }
    var shown = (_voiceFinal + ' ' + interim).trim();
    setVoiceStatus('listening', shown || 'Слушаю…');
  };

  // Срабатывает и когда нажал ещё раз, и когда сам остановился на тишине
  recognition.onend = function() {
    isListening = false;
    if (_voiceFinal.trim()) {
      parseVoiceWithAI(_voiceFinal.trim());
    } else {
      setVoiceStatus('idle', '');
    }
  };

  recognition.onerror = function(e) {
    console.error('Speech recognition error:', e.error);
    isListening = false;
    var msg = e.error === 'not-allowed' ? 'Нет доступа к микрофону'
            : e.error === 'no-speech'   ? 'Ничего не услышал'
            : 'Ошибка распознавания: ' + e.error;
    setVoiceStatus('idle', msg);
    setTimeout(function() { setVoiceStatus('idle', ''); }, 2500);
  };
}

function initFirebase() {
  firebase.initializeApp({
    apiKey: "AIzaSyDXkHVg3ucKGiG6QF3SFxds7MuTJ95Wx60",
    authDomain: "bdds-1.firebaseapp.com",
    projectId: "bdds-1",
    storageBucket: "bdds-1.firebasestorage.app",
    messagingSenderId: "94953276486",
    appId: "1:94953276486:web:5c211765490485a9cd7647"
  });
  window.db = firebase.firestore();
  window.auth = firebase.auth();

  var _unsubAuth = window.auth.onAuthStateChanged(function(user) {
    _unsubAuth();
    if (user) {
      firebaseUid = user.uid;
      loadTasks().then(showApp);
    } else {
      showLogin();
    }
  });
}

function _lsKey() { return firebaseUid ? ('tasks_cache_' + firebaseUid) : 'tasks_cache'; }

function loadTasks() {
  return new Promise(function(resolve) {
    var lsData = null;
    try {
      var raw = localStorage.getItem(_lsKey());
      if (raw) lsData = JSON.parse(raw);
    } catch(e) {}
    var lsValid = lsData && Array.isArray(lsData.tasks);

    function apply(d) {
      tasks = (d && Array.isArray(d.tasks)) ? d.tasks : [];
      projects = (d && Array.isArray(d.projects)) ? d.projects : [];
      notes = (d && Array.isArray(d.notes)) ? d.notes : [];
      protocols = (d && Array.isArray(d.protocols)) ? d.protocols : [];
      if (d && d.currentView) currentView = d.currentView;
      globalView = 'dashboard';        // при запуске всегда открываем сводку
      hiddenProjects = (d && Array.isArray(d.hiddenProjects)) ? d.hiddenProjects : [];
      if (projects.length === 0) {
        projects = [{id: 'default', name: 'Основное'}];
      }
      currentProject = projects[0].id;
    }

    var settled = false;
    var timer = setTimeout(function() {
      if (settled) return;
      settled = true;
      apply(lsData);
      resolve();
    }, 6000);

    window.db.doc('tasks/' + firebaseUid).get()
      .then(function(snap) {
        var fbData = snap.exists ? snap.data() : null;
        var fbValid = fbData && Array.isArray(fbData.tasks);
        var d = null;
        if (fbValid && lsValid) {
          d = (lsData.updatedAt || 0) > (fbData.updatedAt || 0) ? lsData : fbData;
        } else if (fbValid) {
          d = fbData;
        } else if (lsValid) {
          d = lsData;
        }
        if (settled) return;
        settled = true; clearTimeout(timer);
        apply(d);
        resolve();
      })
      .catch(function(e) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        console.error('[loadTasks] server error, fallback to localStorage:', e);
        apply(lsData);
        resolve();
      });
  });
}

var _saveTimer = null;
function _setSaveIndicator(state) {
  var el = document.getElementById('save-indicator');
  if (!el) return;
  if (state === 'saving') { el.textContent = '⏳ Сохранение…'; el.style.color = '#aaa'; }
  else if (state === 'saved') { el.textContent = '✓ Сохранено'; el.style.color = '#0a6e4e'; setTimeout(function(){ el.textContent=''; }, 2000); }
  else { el.textContent = '⚠ Ошибка сохранения'; el.style.color = '#c0392b'; }
}

function saveTasks() {
  var payload = {
    tasks: tasks, projects: projects, notes: notes, protocols: protocols,
    currentProject: currentProject, currentView: currentView, globalView: globalView,
    hiddenProjects: hiddenProjects, updatedAt: Date.now()
  };
  try { localStorage.setItem(_lsKey(), JSON.stringify(payload)); } catch(e) {}
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function() {
    if (!firebaseUid) return;
    _setSaveIndicator('saving');
    window.db.doc('tasks/' + firebaseUid).set(payload)
      .then(function() { _setSaveIndicator('saved'); })
      .catch(function(e) { console.error('Save error:', e); _setSaveIndicator('error'); });
  }, 500);
}

/* ---------- Auth ---------- */
function showLoginError(msg) {
  var el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideLoginError() {
  document.getElementById('login-error').style.display = 'none';
}

function handleLogin() {
  hideLoginError();
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;
  if (!email || !password) { showLoginError('Введите email и пароль'); return; }
  window.auth.signInWithEmailAndPassword(email, password)
    .catch(function(e) { showLoginError(translateAuthError(e)); });
}

function handleRegister() {
  hideLoginError();
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;
  if (!email || !password) { showLoginError('Введите email и пароль'); return; }
  if (password.length < 6) { showLoginError('Пароль должен быть не короче 6 символов'); return; }
  window.auth.createUserWithEmailAndPassword(email, password)
    .catch(function(e) { showLoginError(translateAuthError(e)); });
}

function handleLogout() {
  window.auth.signOut().then(function() {
    tasks = [];
    firebaseUid = null;
  });
}

function translateAuthError(e) {
  var code = e && e.code;
  if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Неверный email или пароль';
  if (code === 'auth/user-not-found') return 'Пользователь не найден';
  if (code === 'auth/email-already-in-use') return 'Этот email уже зарегистрирован — просто войдите';
  if (code === 'auth/invalid-email') return 'Некорректный email';
  if (code === 'auth/weak-password') return 'Пароль слишком простой';
  return 'Ошибка: ' + (e && e.message ? e.message : e);
}

function showLogin() {
  document.body.classList.remove('authed');
}
function syncDatePlaceholder(el) {
  if (el) el.classList.toggle('is-empty', !el.value);
}

function initDatePlaceholders() {
  ['new-due', 'task-due-input', 'entry-date'].forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    syncDatePlaceholder(el);
    ['input', 'change', 'blur'].forEach(function(ev) {
      el.addEventListener(ev, function() { syncDatePlaceholder(el); });
    });
  });
}

function showApp() {
  document.body.classList.add('authed');
  initDatePlaceholders();
  render();
}

/* ---------- Task operations ---------- */
function addTask() {
  var titleEl = document.getElementById('new-title');
  var descEl = document.getElementById('new-desc');
  var title = titleEl.value.trim();
  if (!title) return;
  var due = document.getElementById('new-due').value || null;
  if (!due && currentView === 'today') due = todayStr();
  var priority = document.getElementById('new-priority').value;
  tasks.push({
    id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    title: title,
    description: descEl.value.trim(),
    projectId: currentProject,
    done: false,
    priority: priority,
    due: due,
    time: null,
    createdAt: Date.now(),
    doneAt: null
  });
  titleEl.value = '';
  descEl.value = '';
  document.getElementById('new-due').value = '';
  syncDatePlaceholder(document.getElementById('new-due'));
  document.getElementById('new-priority').value = 'normal';
  titleEl.focus();
  saveTasks();
  render();
}

function selectProject(id) {
  currentProject = id;
  globalView = null;
  saveTasks();
  render();
}

// Сводные разделы над списком проектов: собирают задачи всех проектов сразу
function selectGlobal(v) {
  globalView = v;
  saveTasks();
  render();
}

/* ---------- Перетаскивание проектов в левом меню ---------- */
var _projDrag = null;
var _projDragMoved = false;

function projDragStart(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  var row = e.currentTarget.parentNode;
  var list = document.getElementById('projects-list');
  _projDrag = {
    row: row,
    list: list,
    horizontal: getComputedStyle(list).flexDirection === 'row',
    moved: false
  };
  _projDragMoved = false;
  row.classList.add('dragging');
  try { list.setPointerCapture(e.pointerId); } catch (_) {}
  list.addEventListener('pointermove', projDragMove);
  list.addEventListener('pointerup', projDragEnd);
  list.addEventListener('pointercancel', projDragEnd);
}

function projDragMove(e) {
  var d = _projDrag;
  if (!d) return;
  e.preventDefault();
  d.moved = true;
  var pos = d.horizontal ? e.clientX : e.clientY;
  var others = Array.prototype.filter.call(
    d.list.querySelectorAll('.proj'),
    function(r) { return r !== d.row; }
  );
  var before = null;
  for (var i = 0; i < others.length; i++) {
    var b = others[i].getBoundingClientRect();
    var mid = d.horizontal ? b.left + b.width / 2 : b.top + b.height / 2;
    if (pos < mid) { before = others[i]; break; }
  }
  if (before) d.list.insertBefore(d.row, before);
  else d.list.appendChild(d.row);
}

function projDragEnd(e) {
  var d = _projDrag;
  if (!d) return;
  _projDrag = null;
  d.row.classList.remove('dragging');
  d.list.removeEventListener('pointermove', projDragMove);
  d.list.removeEventListener('pointerup', projDragEnd);
  d.list.removeEventListener('pointercancel', projDragEnd);
  try { d.list.releasePointerCapture(e.pointerId); } catch (_) {}
  if (!d.moved) return;

  // гасим клик, который браузер пошлёт строке сразу после перетаскивания
  _projDragMoved = true;
  setTimeout(function() { _projDragMoved = false; }, 0);

  var order = Array.prototype.map.call(d.list.querySelectorAll('.proj'),
    function(r) { return r.dataset.id; });
  var ordered = [];
  order.forEach(function(id) {
    var p = projects.find(function(x) { return x.id === id; });
    if (p && ordered.indexOf(p) === -1) ordered.push(p);
  });
  projects.forEach(function(p) { if (ordered.indexOf(p) === -1) ordered.push(p); });
  projects = ordered;
  saveTasks();
  render();
}

function addProject() {
  var name = prompt('Название проекта:');
  if (!name || !name.trim()) return;
  projects.push({ id: 'p_' + Date.now(), name: name.trim() });
  currentProject = projects[projects.length - 1].id;
  saveTasks();
  render();
}

function renameProject(id) {
  var p = projects.find(function(x) { return x.id === id; });
  if (!p) return;
  var name = prompt('Название проекта (очистите поле, чтобы удалить проект):', p.name);
  if (name === null) return;
  if (!name.trim()) {
    if (projects.length === 1) { alert('Нельзя удалить единственный проект'); return; }
    var n = tasks.filter(function(t) { return t.projectId === id; }).length;
    var np = protocols.filter(function(x) { return x.projectId === id; }).length;
    var nn = notes.filter(function(x) { return x.projectId === id; }).length;
    var what = [];
    if (n) what.push(n + ' задач');
    if (np) what.push(np + ' протоколов');
    if (nn) what.push(nn + ' заметок');
    var msg = 'Удалить проект «' + p.name + '»?';
    if (what.length) msg += '\n\nВместе с ним удалится: ' + what.join(', ') + '. Отменить будет нельзя.';
    if (!confirm(msg)) return;
    tasks = tasks.filter(function(t) { return t.projectId !== id; });
    notes = notes.filter(function(n) { return n.projectId !== id; });
    protocols = protocols.filter(function(pr) { return pr.projectId !== id; });
    projects = projects.filter(function(x) { return x.id !== id; });
    if (currentProject === id) currentProject = projects[0].id;
  } else {
    p.name = name.trim();
  }
  saveTasks();
  render();
}

function toggleDone(id) {
  var t = tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  saveTasks();
  render();
}

function deleteTask(id) {
  var t = tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  if (!confirm('Удалить задачу «' + t.title + '»?')) return;
  tasks = tasks.filter(function(x) { return x.id !== id; });
  saveTasks();
  render();
}

function setFilter(f) {
  filter = f;
  render();
}

function toggleVoice() {
  if (!recognition) {
    alert('Голосовой ввод не поддерживается в вашем браузере');
    return;
  }
  if (isListening) {
    recognition.stop();
  } else {
    recognition.start();
  }
}

function openTaskModal(id) {
  var t = tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  currentTaskId = id;
  document.getElementById('task-title-input').value = t.title;
  document.getElementById('task-desc-input').value = t.description || '';
  document.getElementById('task-due-input').value = t.due || '';
  syncDatePlaceholder(document.getElementById('task-due-input'));
  document.getElementById('task-time-input').value = t.time || '';
  document.getElementById('task-prio-input').value = t.priority;
  document.getElementById('task-done-input').checked = t.done;

  var sel = document.getElementById('task-project-input');
  sel.innerHTML = '';
  projects.forEach(function(p) {
    var o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name;
    if (p.id === t.projectId) o.selected = true;
    sel.appendChild(o);
  });

  document.getElementById('task-modal').classList.add('visible');
  document.getElementById('task-title-input').focus();
}

function closeTaskModal() {
  currentTaskId = null;
  document.getElementById('task-modal').classList.remove('visible');
}

function saveTaskModal() {
  if (!currentTaskId) return;
  var t = tasks.find(function(x) { return x.id === currentTaskId; });
  if (!t) return;
  t.title = document.getElementById('task-title-input').value.trim() || t.title;
  t.description = document.getElementById('task-desc-input').value;
  t.due = document.getElementById('task-due-input').value || null;
  t.time = document.getElementById('task-time-input').value || null;
  if (!t.due) t.time = null;
  t.priority = document.getElementById('task-prio-input').value;
  t.projectId = document.getElementById('task-project-input').value || t.projectId;
  var wasDone = t.done;
  t.done = document.getElementById('task-done-input').checked;
  if (!wasDone && t.done) t.doneAt = Date.now();
  else if (wasDone && !t.done) t.doneAt = null;
  saveTasks();
  closeTaskModal();
  render();
}

document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  closeTaskModal();
  closeEntryModal();
});

function deleteCurrentTask() {
  if (!currentTaskId) return;
  var id = currentTaskId;
  var before = tasks.length;
  deleteTask(id);
  if (tasks.length === before) return;   // пользователь отказался
  closeTaskModal();
}


/* ==================== Разделы: Сегодня / Неделя / Список / Протоколы / Заметки ==================== */

var VIEW_LABELS = {
  today: 'Сегодня', week: 'Неделя', list: 'Список',
  protocols: 'Протоколы', notes: 'Заметки'
};
var DAY_SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
var MONTH_GEN = ['января','февраля','марта','апреля','мая','июня',
                 'июля','августа','сентября','октября','ноября','декабря'];
var _weekDayStrs = [];
var dashWeekOffset = 0;            // какая неделя показана на диаграмме дашборда
var HOUR_FROM = 9;
var HOUR_TO = 19;

function setView(v) {
  currentView = v;
  weekOffset = 0;
  saveTasks();
  render();
}

function pad2(n) { return String(n).padStart(2, '0'); }

function dateToStr(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function strToDate(str) {
  var a = str.split('-');
  return new Date(+a[0], +a[1] - 1, +a[2]);
}

function mondayOf(offsetWeeks) {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  var dow = (d.getDay() + 6) % 7;            // 0 = понедельник
  d.setDate(d.getDate() - dow + offsetWeeks * 7);
  return d;
}

function shiftWeek(n) {
  weekOffset = (n === 0) ? 0 : weekOffset + n;
  render();
}

function projectTasks() {
  if (globalView) return tasks.slice();          // сводный раздел — все проекты
  return tasks.filter(function(t) { return t.projectId === currentProject; });
}

var _dashAnim = false;

// Неделя не подменяется рывком: старая уезжает в сторону движения,
// новая въезжает с противоположной.
function shiftDashWeek(n) {
  if (_dashAnim) return;
  var chart = document.getElementById('dash-chart');
  dashWeekOffset += n;

  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!chart || still) { renderDashboard(); return; }

  _dashAnim = true;
  var away = n > 0 ? -34 : 34;     // уезжает туда, куда вело движение
  chart.classList.remove('dragging');
  chart.style.transform = 'translateX(' + away + 'px)';
  chart.style.opacity = '0';

  setTimeout(function() {
    renderDashboard();
    // ставим новую неделю за противоположным краем и отпускаем
    chart.classList.add('dragging');          // на миг без плавности
    chart.style.transform = 'translateX(' + (-away) + 'px)';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        chart.classList.remove('dragging');
        chart.style.transform = '';
        chart.style.opacity = '';
        _dashAnim = false;
      });
    });
  }, 150);
}

// Листаем на весь показанный промежуток, а не на одну неделю:
// иначе половина столбиков осталась бы прежней и было бы не понять, что сменилось.
function projectShown(id) {
  return hiddenProjects.indexOf(id) === -1;
}

function toggleProjectShown(id) {
  var i = hiddenProjects.indexOf(id);
  if (i === -1) hiddenProjects.push(id);
  else hiddenProjects.splice(i, 1);
  saveTasks();
  render();                 // меню и сводку перерисовываем вместе
}

function dashPage(dir) {
  shiftDashWeek(dir * DASH_WEEKS);
}

function resetDashWeek() {
  if (_dashAnim || !dashWeekOffset) return;
  shiftDashWeek(-dashWeekOffset);      // вернётся к нулю той же анимацией
}

// листание недели пальцем или мышью прямо по диаграмме
var _dashSwipeReady = false;
function initDashSwipe() {
  if (_dashSwipeReady) return;
  var chart = document.getElementById('dash-chart');
  if (!chart) return;
  _dashSwipeReady = true;

  var start = null;

  chart.addEventListener('pointerdown', function(e) {
    if (_dashAnim) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    chart.classList.add('dragging');     // тянем без плавности, след в след за пальцем
  });

  chart.addEventListener('pointermove', function(e) {
    if (!start || e.pointerId !== start.id) return;
    var dx = e.clientX - start.x;
    var dy = e.clientY - start.y;
    if (Math.abs(dx) <= Math.abs(dy)) return;      // вертикальное движение не перехватываем
    // с сопротивлением: диаграмма идёт медленнее пальца, видно, что это не свободный сдвиг
    chart.style.transform = 'translateX(' + (dx * 0.35) + 'px)';
  });

  function finish(e) {
    if (!start || e.pointerId !== start.id) return;
    var dx = e.clientX - start.x;
    var dy = e.clientY - start.y;
    start = null;
    chart.classList.remove('dragging');            // дальше уже с плавностью
    chart.style.transform = '';                    // не дотянул — вернётся на место сам

    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      dashPage(dx < 0 ? 1 : -1);
    }
  }

  chart.addEventListener('pointerup', finish);
  chart.addEventListener('pointercancel', function() {
    start = null;
    chart.classList.remove('dragging');
    chart.style.transform = '';
  });
}

function projectName(id) {
  var p = projects.find(function(x) { return x.id === id; });
  return p ? p.name : '';
}

function renderViewTabs() {
  document.body.classList.remove('view-today', 'view-week', 'view-list', 'view-protocols', 'view-notes');
  document.body.classList.toggle('global-mode', !!globalView);
  document.body.classList.toggle('global-dashboard', globalView === 'dashboard');
  // сводный «Сегодня» показывается тем же блоком, что и вкладка проекта;
  // у дашборда своей вкладки нет — иначе всплывал бы переключатель дней
  if (globalView === 'today') document.body.classList.add('view-today');
  else if (!globalView) document.body.classList.add('view-' + currentView);

  document.querySelectorAll('.nav-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.nav === globalView);
  });
  if (globalView) return;

  var today = todayStr();
  var mine = projectTasks();
  var counts = {
    today: mine.filter(function(t) { return !t.done && t.due === today; }).length,
    week: 0,
    list: mine.filter(function(t) { return !t.done; }).length,
    protocols: protocols.filter(function(e) { return e.projectId === currentProject; }).length,
    notes: notes.filter(function(e) { return e.projectId === currentProject; }).length
  };
  var mon = mondayOf(0), weekDays = [];
  for (var i = 0; i < 5; i++) {
    var d = new Date(mon); d.setDate(mon.getDate() + i);
    weekDays.push(dateToStr(d));
  }
  counts.week = mine.filter(function(t) { return !t.done && t.due && weekDays.indexOf(t.due) !== -1; }).length;

  document.querySelectorAll('.vtab').forEach(function(btn) {
    var v = btn.dataset.view;
    btn.classList.toggle('active', v === currentView);
    btn.innerHTML = '';
    btn.appendChild(document.createTextNode(VIEW_LABELS[v]));
    if (counts[v] > 0) {
      var c = document.createElement('span');
      c.className = 'vtab-count';
      c.textContent = counts[v];
      btn.appendChild(c);
    }
  });
}

/* ---------- Компактная карточка задачи для досок ---------- */
function buildTaskCard(t, opts) {
  opts = opts || {};
  if (globalView) opts.showProject = true;
  var today = todayStr();
  var card = document.createElement('div');
  card.className = 'tcard' + (t.done ? ' done' : '') + (t.priority === 'high' ? ' prio-high' : '');
  if (!t.done && t.due) {
    if (t.due < today) card.classList.add('overdue');
    else if (t.due === today) card.classList.add('due-today');
  }
  card.dataset.id = t.id;
  card.onclick = function() { if (!_taskDragMoved) openTaskModal(t.id); };
  card.addEventListener('pointerdown', function(e) { taskPointerDown(e, t.id, card, false); });

  var grip = document.createElement('span');
  grip.className = 'tcard-grip';
  grip.textContent = '⠿';
  grip.title = 'Потяните, чтобы перенести задачу';
  grip.addEventListener('pointerdown', function(e) { taskPointerDown(e, t.id, card, true); });
  grip.addEventListener('click', function(e) { e.stopPropagation(); e.preventDefault(); });
  card.appendChild(grip);

  var cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'tcard-check';
  cb.checked = t.done;
  cb.onclick = function(e) { e.stopPropagation(); toggleDone(t.id); };
  card.appendChild(cb);

  var body = document.createElement('div');
  body.className = 'tcard-body';

  var title = document.createElement('div');
  title.className = 'tcard-title';
  title.textContent = t.title;
  body.appendChild(title);

  if (opts.showDesc && t.description && t.description.trim()) {
    var desc = document.createElement('div');
    desc.className = 'tcard-desc';
    desc.textContent = t.description.trim();
    body.appendChild(desc);
  }

  var meta = document.createElement('div');
  meta.className = 'tcard-meta';
  var any = false;

  if (t.priority && t.priority !== 'normal') {
    var pr = document.createElement('span');
    pr.className = 'pill';
    var dot = document.createElement('span');
    dot.className = 'dot ' + t.priority;
    pr.appendChild(dot);
    pr.appendChild(document.createTextNode(prioLabel[t.priority]));
    meta.appendChild(pr); any = true;
  }
  if (opts.showDate && t.due) {
    var dp = document.createElement('span');
    dp.className = 'pill';
    var label = formatDue(t.due);
    if (!t.done && t.due < today) { dp.className += ' overdue'; label = 'Просрочено · ' + label; }
    else if (!t.done && t.due === today) { dp.className += ' today'; label = 'Сегодня'; }
    dp.textContent = label;
    meta.appendChild(dp); any = true;
  }
  if (opts.showProject) {
    var pp = document.createElement('span');
    pp.className = 'pill';
    pp.textContent = projectName(t.projectId);
    meta.appendChild(pp); any = true;
  }
  if (opts.showTime && t.time) {
    var tp = document.createElement('span');
    tp.className = 'pill';
    tp.textContent = t.time;
    meta.appendChild(tp); any = true;
  }
  if (any) body.appendChild(meta);

  card.appendChild(body);
  return card;
}

function sortForBoard(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  if ((a.time || '') !== (b.time || '')) {
    if (!a.time) return 1;
    if (!b.time) return -1;
    return a.time < b.time ? -1 : 1;
  }
  if (prioRank[a.priority] !== prioRank[b.priority]) return prioRank[a.priority] - prioRank[b.priority];
  return a.createdAt - b.createdAt;
}

/* ---------- Вкладка «Неделя» ---------- */
function renderWeek() {
  var mon = mondayOf(weekOffset);
  var days = [];
  for (var i = 0; i < 5; i++) {
    var d = new Date(mon); d.setDate(mon.getDate() + i);
    days.push({ date: d, str: dateToStr(d), short: DAY_SHORT[i] });
  }

  var fri = days[4].date;
  var label = mon.getDate() + (mon.getMonth() === fri.getMonth() ? '' : ' ' + MONTH_GEN[mon.getMonth()]) +
              ' – ' + fri.getDate() + ' ' + MONTH_GEN[fri.getMonth()];
  if (weekOffset === 0) label += ' · текущая неделя';
  document.getElementById('week-label').textContent = label;

  var today = todayStr();
  var mine = projectTasks().filter(function(t) { return !t.done; });
  _weekDayStrs = days.map(function(d) { return d.str; });

  var board = document.getElementById('week-board');
  board.innerHTML = '';

  var cols = days.map(function(d) {
    return { key: 'day', title: d.short, sub: pad2(d.date.getDate()) + '.' + pad2(d.date.getMonth() + 1), date: d.str };
  });

  cols.forEach(function(c) {
    var col = document.createElement('div');
    col.className = 'week-col' + (c.date === today ? ' is-today' : '');

    var head = document.createElement('div');
    head.className = 'week-col-head';
    var h1 = document.createElement('span');
    h1.textContent = c.title;
    var h2 = document.createElement('span');
    h2.className = 'wd';
    h2.textContent = c.sub;
    head.appendChild(h1); head.appendChild(h2);
    col.appendChild(head);

    var drop = document.createElement('div');
    drop.className = 'week-drop';
    drop.dataset.drop = 'day';
    drop.dataset.date = c.date;

    var items = mine.filter(function(t) { return t.due === c.date; });
    items.sort(sortForBoard);

    if (items.length === 0) {
      var e = document.createElement('div');
      e.className = 'week-empty';
      e.textContent = '—';
      drop.appendChild(e);
    } else {
      items.forEach(function(t) {
        drop.appendChild(buildTaskCard(t, { showTime: true }));
      });
    }

    col.appendChild(drop);
    board.appendChild(col);
  });

  // ---- Полка: всё, что не попало в показанные пять дней, по важности ----
  var backlog = document.getElementById('week-backlog');
  backlog.innerHTML = '';
  var loose = mine.filter(function(t) { return !t.due || _weekDayStrs.indexOf(t.due) === -1; });
  loose.sort(function(a, b) {
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;          // с датой — выше
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    return a.createdAt - b.createdAt;
  });

  ['high', 'normal', 'low'].forEach(function(prio) {
    var col = document.createElement('div');
    col.className = 'backlog-col';

    var items = loose.filter(function(t) { return (t.priority || 'normal') === prio; });

    var head = document.createElement('div');
    head.className = 'backlog-col-head';
    var dot = document.createElement('span');
    dot.className = 'dot ' + prio;
    head.appendChild(dot);
    head.appendChild(document.createTextNode(prioLabel[prio]));
    var n = document.createElement('span');
    n.className = 'n';
    n.textContent = items.length || '';
    head.appendChild(n);
    col.appendChild(head);

    var drop = document.createElement('div');
    drop.className = 'backlog-drop';
    drop.dataset.drop = 'backlog';
    drop.dataset.prio = prio;

    if (items.length === 0) {
      var e = document.createElement('div');
      e.className = 'week-empty';
      e.textContent = '—';
      drop.appendChild(e);
    } else {
      items.forEach(function(t) { drop.appendChild(buildTaskCard(t, { showDate: true, showTime: true })); });
    }

    col.appendChild(drop);
    backlog.appendChild(col);
  });
}

/* ---------- Вкладка «Сегодня» ---------- */
var TODAY_COLS = [
  { off: 0, name: 'Сегодня' },
  { off: 1, name: 'Завтра' },
  { off: 2, name: 'Послезавтра' }
];

function renderToday() {
  var box = document.getElementById('today-container');
  box.innerHTML = '';
  var mine = projectTasks();
  var nowHour = new Date().getHours();

  TODAY_COLS.forEach(function(c) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + c.off);
    var dayStr = dateToStr(d);
    var ofDay = mine.filter(function(t) { return t.due === dayStr; });

    var col = document.createElement('div');
    col.className = 'today-col' + (c.off === 0 ? ' is-today' : '');

    // заголовок: название дня и дата под ним
    var head = document.createElement('div');
    head.className = 'today-col-head';
    var h = document.createElement('b');
    h.textContent = c.name;
    var sub = document.createElement('span');
    sub.textContent = DAY_SHORT[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MONTH_GEN[d.getMonth()];
    head.appendChild(h);
    head.appendChild(sub);
    col.appendChild(head);

    col.appendChild(buildHourGrid(ofDay, dayStr, c.off === 0 ? nowHour : -1));
    col.appendChild(buildUntimedBox(ofDay, dayStr));
    box.appendChild(col);
  });
}

function buildHourGrid(ofDay, dayStr, nowHour) {
  var hoursEl = document.createElement('div');
  hoursEl.className = 'today-hours';

  for (var h = HOUR_FROM; h <= HOUR_TO; h++) {
    var row = document.createElement('div');
    row.className = 'hour-row' + (h === nowHour ? ' is-now' : '');

    var lab = document.createElement('div');
    lab.className = 'hour-label';
    lab.textContent = pad2(h) + ':00';
    row.appendChild(lab);

    var slot = document.createElement('div');
    slot.className = 'hour-slot';
    slot.dataset.drop = 'hour';
    slot.dataset.date = dayStr;
    slot.dataset.time = pad2(h) + ':00';

    // задачи раньше первой и позже последней строки не теряем — прижимаем к краю
    var inHour = ofDay.filter(function(t) {
      if (!t.time) return false;
      var th = parseInt(t.time.split(':')[0], 10);
      if (h === HOUR_FROM) return th <= HOUR_FROM;
      if (h === HOUR_TO) return th >= HOUR_TO;
      return th === h;
    }).sort(sortForBoard);
    inHour.forEach(function(t) { slot.appendChild(buildTaskCard(t, { showTime: true })); });

    row.appendChild(slot);
    hoursEl.appendChild(row);
  }
  return hoursEl;
}

function buildUntimedBox(ofDay, dayStr) {
  var box = document.createElement('div');
  box.className = 'today-untimed';

  var title = document.createElement('h4');
  title.textContent = 'Без времени';
  box.appendChild(title);

  var drop = document.createElement('div');
  drop.className = 'today-drop';
  drop.dataset.drop = 'untimed';
  drop.dataset.date = dayStr;

  var untimed = ofDay.filter(function(t) { return !t.time; }).sort(sortForBoard);
  if (untimed.length === 0) {
    drop.innerHTML = '<div class="week-empty">—</div>';
  } else {
    untimed.forEach(function(t) { drop.appendChild(buildTaskCard(t)); });
  }
  box.appendChild(drop);
  return box;
}

/* ---------- Перетаскивание задач между колонками и часами ---------- */
var _taskDrag = null;
var _taskDragMoved = false;
var _taskPending = null;

// Тянуть плашку можно за любое место. Чтобы это не мешало ни открытию задачи,
// ни прокрутке страницы: мышью перетаскивание начинается после сдвига на 5 пикселей,
// пальцем — после удержания четверть секунды (сдвинул раньше — значит, листаешь).
var DRAG_MOUSE_SLOP = 5;
var DRAG_TOUCH_SLOP = 10;
var DRAG_HOLD_MS = 250;

function taskPointerDown(e, taskId, card, immediate) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target && e.target.classList && e.target.classList.contains('tcard-check')) return;
  clearTaskPending();

  _taskPending = {
    id: taskId, card: card, pointerId: e.pointerId, type: e.pointerType,
    x: e.clientX, y: e.clientY, timer: null
  };
  document.addEventListener('pointermove', taskMoveRouter, { passive: false });
  document.addEventListener('pointerup', taskUpRouter);
  document.addEventListener('pointercancel', taskUpRouter);

  if (immediate) {
    e.preventDefault();
    e.stopPropagation();
    beginTaskDrag(e.clientX, e.clientY, e.pointerId, card, taskId);
  } else if (e.pointerType !== 'mouse') {
    _taskPending.timer = setTimeout(function() {
      var pd = _taskPending;
      if (pd) beginTaskDrag(pd.x, pd.y, pd.pointerId, pd.card, pd.id);
    }, DRAG_HOLD_MS);
  }
}

function clearTaskPending() {
  if (_taskPending && _taskPending.timer) clearTimeout(_taskPending.timer);
  _taskPending = null;
}

function taskMoveRouter(e) {
  if (_taskDrag) { taskDragMove(e); return; }
  var pd = _taskPending;
  if (!pd || e.pointerId !== pd.pointerId) return;
  var dx = e.clientX - pd.x, dy = e.clientY - pd.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (pd.type === 'mouse') {
    if (dist > DRAG_MOUSE_SLOP) beginTaskDrag(e.clientX, e.clientY, pd.pointerId, pd.card, pd.id);
  } else if (dist > DRAG_TOUCH_SLOP) {
    clearTaskPending();          // палец поехал раньше времени — это прокрутка
  }
}

function taskUpRouter(e) {
  if (_taskDrag) taskDragEnd(e);
  clearTaskPending();
  document.removeEventListener('pointermove', taskMoveRouter);
  document.removeEventListener('pointerup', taskUpRouter);
  document.removeEventListener('pointercancel', taskUpRouter);
}

function beginTaskDrag(x, y, pointerId, card, taskId) {
  clearTaskPending();
  var t = tasks.find(function(item) { return item.id === taskId; });

  var ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = t ? t.title : '';
  document.body.appendChild(ghost);

  _taskDrag = { id: taskId, card: card, ghost: ghost, zone: null, moved: false, pointerId: pointerId };
  _taskDragMoved = false;
  card.classList.add('drag-source');
  document.body.classList.add('dragging-task');
  moveGhostTo(x, y);
}

function moveGhostTo(x, y) {
  if (!_taskDrag) return;
  _taskDrag.ghost.style.left = (x + 14) + 'px';
  _taskDrag.ghost.style.top = (y - 12) + 'px';
}

function taskDragMove(e) {
  if (!_taskDrag) return;
  e.preventDefault();
  _taskDrag.moved = true;
  moveGhostTo(e.clientX, e.clientY);

  var under = document.elementFromPoint(e.clientX, e.clientY);
  var zone = under ? under.closest('[data-drop]') : null;
  if (zone !== _taskDrag.zone) {
    if (_taskDrag.zone) _taskDrag.zone.classList.remove('drop-hover');
    _taskDrag.zone = zone;
    if (zone) zone.classList.add('drop-hover');
  }
}

function taskDragEnd(e) {
  var d = _taskDrag;
  if (!d) return;
  _taskDrag = null;

  document.body.classList.remove('dragging-task');
  if (d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  d.card.classList.remove('drag-source');
  if (d.zone) d.zone.classList.remove('drop-hover');

  if (!d.moved) return;
  _taskDragMoved = true;
  setTimeout(function() { _taskDragMoved = false; }, 0);
  if (!d.zone) return;

  var t = tasks.find(function(x) { return x.id === d.id; });
  if (!t) return;
  var kind = d.zone.dataset.drop;
  if (kind === 'backlog') {
    t.priority = d.zone.dataset.prio || t.priority;
    // снимаем день только у задач текущей недели: дату другой недели не теряем
    if (t.due && _weekDayStrs.indexOf(t.due) !== -1) { t.due = null; t.time = null; }
  }
  else if (kind === 'day') { t.due = d.zone.dataset.date; }
  else if (kind === 'untimed') { t.due = d.zone.dataset.date; t.time = null; }
  else if (kind === 'hour') { t.due = d.zone.dataset.date; t.time = d.zone.dataset.time; }
  saveTasks();
  render();
}

/* ==================== Дашборд по всем проектам ==================== */
var DASH_WEEKS = 1;    // сколько недель показывает диаграмма дашборда
var hiddenProjects = [];   // проекты, снятые ползунком на дашборде
var MAX_SEG = 8;       // выше столбик не растёт, сколько бы задач ни было

// Возвращает цвета делений сверху вниз: сначала срочные, потом важные, потом мелочь.
// Пока задач не больше восьми — одно деление на задачу. Дальше столбик заполнен
// целиком, а доли перевода считаются пропорционально, с раздачей остатка тем,
// у кого дробная часть больше — иначе из-за округления делений выйдет не восемь.
function segmentsFor(day) {
  var order = ['high', 'normal', 'low'];
  var n = day.n;
  if (!n) return [];

  var counts;
  if (n <= MAX_SEG) {
    counts = order.map(function(p) { return day.by[p]; });
  } else {
    var exact = order.map(function(p) { return day.by[p] / n * MAX_SEG; });
    counts = exact.map(Math.floor);
    var left = MAX_SEG - counts.reduce(function(a, b) { return a + b; }, 0);
    var rest = exact
      .map(function(v, i) { return { i: i, frac: v - Math.floor(v) }; })
      .sort(function(a, b) { return b.frac - a.frac; });
    for (var k = 0; k < left; k++) counts[rest[k % order.length].i]++;

    // Если задачи такой важности есть, но при округлении им не досталось
    // ни одного деления, всё равно показываем одно — забираем у самой
    // большой группы. Иначе единственная срочная задача среди тридцати
    // мелочей пропадала бы со столбика совсем.
    order.forEach(function(p, i) {
      if (day.by[p] > 0 && counts[i] === 0) {
        var big = counts.indexOf(Math.max.apply(null, counts));
        if (counts[big] > 1) { counts[big]--; counts[i] = 1; }
      }
    });
  }

  var out = [];
  order.forEach(function(p, i) {
    for (var j = 0; j < counts[i]; j++) out.push(p);
  });
  return out;
}

function renderDashboard() {

// ---- Диаграмма: две недели, на широком экране одна под другой ----
function renderDashChart(shownTasks, today) {
  var mon = mondayOf(dashWeekOffset);
  document.body.classList.toggle('dash-other-week', dashWeekOffset !== 0);

  var weeks = [];
  for (var w = 0; w < DASH_WEEKS; w++) {
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(mon);
      d.setDate(mon.getDate() + w * 7 + i);
      var str = dateToStr(d);
      var onDay = shownTasks.filter(function(t) { return t.due === str; });
      days.push({
        str: str,
        short: DAY_SHORT[(d.getDay() + 6) % 7],
        num: d.getDate(),
        n: onDay.length,
        by: {
          high: onDay.filter(function(t) { return (t.priority || 'normal') === 'high'; }).length,
          normal: onDay.filter(function(t) { return (t.priority || 'normal') === 'normal'; }).length,
          low: onDay.filter(function(t) { return (t.priority || 'normal') === 'low'; }).length
        }
      });
    }
    weeks.push(days);
  }

  var last = new Date(mon); last.setDate(mon.getDate() + 7 * DASH_WEEKS - 1);
  document.getElementById('dash-chart-title').textContent =
    'Задачи на ' + mon.getDate() +
    (mon.getMonth() === last.getMonth() ? '' : ' ' + MONTH_GEN[mon.getMonth()]) +
    ' – ' + last.getDate() + ' ' + MONTH_GEN[last.getMonth()];

  initDashSwipe();

  var legend = document.getElementById('dash-legend');
  legend.innerHTML = '';
  ['high', 'normal', 'low'].forEach(function(prio) {
    var item = document.createElement('span');
    var dot = document.createElement('span');
    dot.className = 'dot ' + prio;
    item.appendChild(dot);
    item.appendChild(document.createTextNode(prioLabel[prio]));
    legend.appendChild(item);
  });

  var chart = document.getElementById('dash-chart');
  chart.innerHTML = '';
  weeks.forEach(function(days, wi) {
    var row = document.createElement('div');
    row.className = 'dash-week' + (wi ? ' second' : '');
    days.forEach(function(day) { row.appendChild(buildDayColumn(day, today)); });
    chart.appendChild(row);
  });
}

function buildDayColumn(day, today) {
  var col = document.createElement('div');
  col.className = 'dash-bar-col' + (day.n === 0 ? ' zero' : '') + (day.str === today ? ' is-today' : '');

  var v = document.createElement('div');
  v.className = 'dash-bar-v';
  v.textContent = day.n;
  col.appendChild(v);

  var wrap = document.createElement('div');
  wrap.className = 'dash-bar-wrap';
  var bar = document.createElement('div');
  var segs = segmentsFor(day);
  bar.className = 'dash-bar' + (segs.length ? '' : ' empty');
  bar.style.height = segs.length ? (segs.length / MAX_SEG * 100) + '%' : '';
  segs.forEach(function(prio) {
    var seg = document.createElement('div');
    seg.className = 'dash-seg ' + prio;
    bar.appendChild(seg);
  });
  bar.title = ['high', 'normal', 'low'].map(function(prio) {
    return prioLabel[prio] + ': ' + day.by[prio];
  }).join(' · ');
  wrap.appendChild(bar);
  col.appendChild(wrap);

  var lab = document.createElement('div');
  lab.className = 'dash-bar-lab';
  var ld = document.createElement('span');
  ld.className = 'dl-d';
  ld.textContent = day.short;
  var ln = document.createElement('span');
  ln.className = 'dl-n';
  ln.textContent = day.num;
  lab.appendChild(ld);
  lab.appendChild(ln);
  col.appendChild(lab);

  return col;
}

// ---- Таблица всех незавершённых задач ----
function renderDashTable(shownTasks, today) {
  var body = document.getElementById('dash-table-body');
  body.innerHTML = '';

  var rows = shownTasks.slice().sort(function(a, b) {
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;          // с датой выше
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    var order = { high: 0, normal: 1, low: 2 };
    var pa = order[a.priority || 'normal'], pb = order[b.priority || 'normal'];
    if (pa !== pb) return pa - pb;
    return a.createdAt - b.createdAt;
  });

  document.getElementById('dash-table-count').textContent = rows.length || '';

  if (rows.length === 0) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.colSpan = 4;
    td.className = 'dash-table-empty';
    td.textContent = 'Задач нет';
    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }

  rows.forEach(function(t) {
    var tr = document.createElement('tr');
    tr.onclick = function() { openTaskModal(t.id); };

    var c1 = document.createElement('td');
    c1.className = 'c-dot';
    var dot = document.createElement('span');
    dot.className = 'dot ' + (t.priority || 'normal');
    c1.appendChild(dot);
    tr.appendChild(c1);

    var c2 = document.createElement('td');
    c2.className = 'c-title' + ((t.priority || 'normal') === 'high' ? ' urgent' : '');
    c2.textContent = t.title;
    tr.appendChild(c2);

    var c3 = document.createElement('td');
    c3.className = 'c-proj';
    c3.textContent = projectName(t.projectId);
    tr.appendChild(c3);

    var c4 = document.createElement('td');
    c4.className = 'c-due' + (t.due && t.due < today ? ' overdue' : '');
    c4.textContent = t.due ? (humanDate(t.due) + (t.time ? ', ' + t.time : '')) : '';
    tr.appendChild(c4);

    body.appendChild(tr);
  });
}

var currentEntryKind = 'protocol';
var currentEntryId = null;

function entryStore(kind) { return kind === 'note' ? notes : protocols; }

function renderEntries(kind) {
  var listEl = document.getElementById(kind === 'note' ? 'notes-list' : 'protocols-list');
  listEl.innerHTML = '';
  var items = entryStore(kind).filter(function(e) { return e.projectId === currentProject; });
  items.sort(function(a, b) {
    if ((a.date || '') !== (b.date || '')) return (a.date || '') < (b.date || '') ? 1 : -1;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty-state">' +
      (kind === 'note' ? 'Заметок пока нет' : 'Протоколов пока нет') + '</div>';
    return;
  }

  items.forEach(function(en) {
    var card = document.createElement('div');
    card.className = 'entry-card';
    card.onclick = function() { openEntryModal(kind, en.id); };

    var dt = document.createElement('div');
    dt.className = 'entry-date';
    dt.textContent = en.date ? formatDue(en.date) : 'без даты';
    card.appendChild(dt);

    var ti = document.createElement('div');
    ti.className = 'entry-title';
    ti.textContent = en.title || 'Без заголовка';
    card.appendChild(ti);

    if (kind === 'protocol' && en.who && en.who.trim()) {
      var wh = document.createElement('div');
      wh.className = 'entry-who';
      wh.textContent = 'Участники: ' + en.who.trim();
      card.appendChild(wh);
    }

    if (en.text && en.text.trim()) {
      var sn = document.createElement('div');
      sn.className = 'entry-snippet';
      sn.textContent = en.text.trim();
      card.appendChild(sn);
    }

    listEl.appendChild(card);
  });
}

function openEntryModal(kind, id) {
  currentEntryKind = kind;
  currentEntryId = id;
  var isNote = kind === 'note';
  var en = id ? entryStore(kind).find(function(x) { return x.id === id; }) : null;

  document.getElementById('entry-modal-title').textContent =
    isNote ? (id ? 'Заметка' : 'Новая заметка') : (id ? 'Протокол' : 'Новый протокол');
  document.getElementById('entry-who-field').style.display = isNote ? 'none' : '';
  document.getElementById('entry-text-label').textContent = isNote ? 'Текст' : 'Что обсудили и решили';
  document.getElementById('entry-date').value = en ? (en.date || '') : todayStr();
  document.getElementById('entry-who').value = en ? (en.who || '') : '';
  document.getElementById('entry-title').value = en ? (en.title || '') : '';
  document.getElementById('entry-text').value = en ? (en.text || '') : '';
  syncDatePlaceholder(document.getElementById('entry-date'));

  document.querySelector('#entry-modal .btn-delete').style.display = id ? '' : 'none';
  document.getElementById('entry-modal').classList.add('visible');
  setTimeout(function() { document.getElementById('entry-title').focus(); }, 30);
}

function closeEntryModal() {
  document.getElementById('entry-modal').classList.remove('visible');
  currentEntryId = null;
}

function saveEntryModal() {
  var kind = currentEntryKind;
  var store = entryStore(kind);
  var data = {
    date: document.getElementById('entry-date').value || null,
    who: document.getElementById('entry-who').value.trim(),
    title: document.getElementById('entry-title').value.trim(),
    text: document.getElementById('entry-text').value
  };
  if (!data.title && !data.text.trim()) { closeEntryModal(); return; }

  if (currentEntryId) {
    var en = store.find(function(x) { return x.id === currentEntryId; });
    if (en) {
      en.date = data.date; en.who = data.who; en.title = data.title; en.text = data.text;
      en.updatedAt = Date.now();
    }
  } else {
    store.push({
      id: (kind === 'note' ? 'n_' : 'pr_') + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      projectId: currentProject,
      date: data.date, who: data.who, title: data.title, text: data.text,
      createdAt: Date.now(), updatedAt: Date.now()
    });
  }
  saveTasks();
  closeEntryModal();
  render();
}

function deleteCurrentEntry() {
  if (!currentEntryId) return;
  var kind = currentEntryKind;
  if (!confirm(kind === 'note' ? 'Удалить заметку?' : 'Удалить протокол?')) return;
  if (kind === 'note') notes = notes.filter(function(x) { return x.id !== currentEntryId; });
  else protocols = protocols.filter(function(x) { return x.id !== currentEntryId; });
  saveTasks();
  closeEntryModal();
  render();
}

/* ---------- Rendering ---------- */
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatDue(due) {
  var parts = due.split('-');
  return parts[2] + '.' + parts[1] + '.' + parts[0].slice(2);
}

var prioRank = { high: 0, normal: 1, low: 2 };
var prioLabel = { high: 'Срочно', normal: 'Важно', low: 'Херня' };

function renderList() {
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t) { t.classList.toggle('active', t.dataset.filter === filter); });

  var today = todayStr();
  var visible = tasks.filter(function(t) {
    if (t.projectId !== currentProject) return false;
    if (filter === 'active') return !t.done;
    if (filter === 'done') return t.done;
    return true;
  });

  visible.sort(function(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    if (prioRank[a.priority] !== prioRank[b.priority]) return prioRank[a.priority] - prioRank[b.priority];
    return a.createdAt - b.createdAt;
  });

  var listEl = document.getElementById('task-list');
  listEl.innerHTML = '';

  if (visible.length === 0) {
    var msg = filter === 'done' ? 'Завершённых задач пока нет'
            : filter === 'active' ? 'Активных задач нет — всё сделано'
            : 'В этом проекте пока нет задач';
    listEl.innerHTML = '<div class="empty-state">' + msg + '</div>';
  } else {
    visible.forEach(function(t) {
      var row = document.createElement('div');
      row.className = 'task-row' + (t.done ? ' done' : '') + (t.priority === 'high' ? ' prio-high' : '');
      if (!t.done && t.due) {
        if (t.due < today) row.classList.add('overdue');
        else if (t.due === today) row.classList.add('due-today');
      }
      // Клик по всей карточке открывает детали
      row.onclick = function() { openTaskModal(t.id); };

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'task-checkbox';
      cb.checked = t.done;
      cb.onclick = function(e) { e.stopPropagation(); toggleDone(t.id); };
      row.appendChild(cb);

      var main = document.createElement('div');
      main.className = 'task-main';

      var title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = t.title;
      main.appendChild(title);

      if (t.description && t.description.trim()) {
        var desc = document.createElement('div');
        desc.className = 'task-desc';
        desc.textContent = t.description.trim().replace(/\s+/g, ' ');
        main.appendChild(desc);
      }

      var meta = document.createElement('div');
      meta.className = 'task-meta';

      var prio = document.createElement('span');
      prio.className = 'pill';
      var dot = document.createElement('span');
      dot.className = 'dot ' + t.priority;
      prio.appendChild(dot);
      prio.appendChild(document.createTextNode(prioLabel[t.priority] || 'Важно'));
      meta.appendChild(prio);

      if (t.due) {
        var duePill = document.createElement('span');
        duePill.className = 'pill';
        var label = formatDue(t.due);
        if (!t.done && t.due < today) { duePill.className += ' overdue'; label = 'Просрочено · ' + label; }
        else if (!t.done && t.due === today) { duePill.className += ' today'; label = 'Сегодня'; }
        duePill.textContent = label;
        meta.appendChild(duePill);
      }

      main.appendChild(meta);
      row.appendChild(main);

      var del = document.createElement('button');
      del.className = 'task-del';
      del.textContent = '×';
      del.title = 'Удалить задачу';
      del.onclick = function(e) { e.stopPropagation(); deleteTask(t.id); };
      row.appendChild(del);

      listEl.appendChild(row);
    });
  }

}

function render() {
  // ---- Sidebar: projects with active-task counts ----
  var projList = document.getElementById('projects-list');
  projList.innerHTML = '';
  projects.forEach(function(p) {
    var row = document.createElement('button');
    row.className = 'proj' + (!globalView && currentProject === p.id ? ' active' : '')
      + (projectShown(p.id) ? '' : ' off');
    row.dataset.id = p.id;
    row.onclick = function() { if (!_projDragMoved) selectProject(p.id); };

    var grip = document.createElement('span');
    grip.className = 'proj-drag';
    grip.textContent = '⠿';
    grip.title = 'Потяните, чтобы переставить проект';
    grip.addEventListener('pointerdown', projDragStart);
    grip.addEventListener('click', function(e) { e.stopPropagation(); e.preventDefault(); });
    row.appendChild(grip);

    // Внутри кнопки нельзя держать настоящий флажок, поэтому ползунок —
    // обычный элемент с ролью переключателя и своим обработчиком.
    var sw = document.createElement('span');
    sw.className = 'proj-switch' + (projectShown(p.id) ? ' on' : '');
    sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-checked', projectShown(p.id) ? 'true' : 'false');
    sw.title = projectShown(p.id) ? 'Учитывать проект в сводке' : 'Проект скрыт из сводки';
    sw.onclick = function(e) { e.stopPropagation(); e.preventDefault(); toggleProjectShown(p.id); };
    sw.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
    row.appendChild(sw);

    var name = document.createElement('span');
    name.className = 'proj-name';
    name.textContent = p.name;
    row.appendChild(name);

    var n = tasks.filter(function(t) { return t.projectId === p.id && !t.done; }).length;
    if (n > 0) {
      var cnt = document.createElement('span');
      cnt.className = 'proj-count';
      cnt.textContent = n;
      row.appendChild(cnt);
    }

    var edit = document.createElement('span');
    edit.className = 'proj-edit';
    edit.textContent = '✎';
    edit.title = 'Переименовать или удалить';
    edit.onclick = function(e) { e.stopPropagation(); renameProject(p.id); };
    row.appendChild(edit);

    projList.appendChild(row);
  });

  // ---- Header: current project name ----
  var proj = projects.find(function(p) { return p.id === currentProject; });
  var titleEl = document.getElementById('project-title');
  titleEl.textContent = globalView === 'today' ? 'Сегодня'
                      : globalView === 'dashboard' ? 'Дашборд'
                      : (proj ? proj.name : 'Задачник');
  titleEl.title = titleEl.textContent;

  var today = todayStr();
  renderViewTabs();
  if (globalView === 'dashboard') renderDashboard();
  else if (globalView === 'today') renderToday();
  else if (currentView === 'list') renderList();
  else if (currentView === 'week') renderWeek();
  else if (currentView === 'today') renderToday();
  else if (currentView === 'protocols') renderEntries('protocol');
  else if (currentView === 'notes') renderEntries('note');

  // ---- Stats for current project ----
  var mine = tasks.filter(function(t) { return t.projectId === currentProject; });
  var activeCount = mine.filter(function(t) { return !t.done; }).length;
  var overdueCount = mine.filter(function(t) { return !t.done && t.due && t.due < today; }).length;
  var todayCount = mine.filter(function(t) { return !t.done && t.due === today; }).length;
  var parts = ['Активных: ' + activeCount];
  if (todayCount > 0) parts.push('на сегодня: ' + todayCount);
  if (overdueCount > 0) parts.push('<span class="overdue-count">просрочено: ' + overdueCount + '</span>');
  document.getElementById('stats').innerHTML = parts.join(' · ');

  setTimeout(syncHeaderHeight, 0);
}

// высота липкой шапки — под ней «прилипают» дата, неделя и фильтры списка
function syncHeaderHeight() {
  var header = document.querySelector('header');
  if (!header) return;
  document.documentElement.style.setProperty('--header-height', header.offsetHeight + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

// ========== Разбор надиктованного через Claude ==========
var _aiParsedData = null;

// Адреса пробуем по порядку. Свой домен идёт первым: адрес workers.dev
// у мобильных операторов бывает заблокирован, через вайфай при этом открывается.
var PARSE_ENDPOINTS = [
  'https://api.v1808.ru/api/parse-voice',
  'https://zadachnic-api.vavitov.workers.dev/api/parse-voice'
];
var _liveEndpoint = null;      // адрес, который сработал в этот раз

async function postToParser(payload) {
  var order = _liveEndpoint
    ? [_liveEndpoint].concat(PARSE_ENDPOINTS.filter(function(u) { return u !== _liveEndpoint; }))
    : PARSE_ENDPOINTS.slice();

  var lastErr = null;
  for (var i = 0; i < order.length; i++) {
    try {
      var r = await fetch(order[i], {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      _liveEndpoint = order[i];
      return r;
    } catch (e) {
      // сюда попадаем, когда адрес недоступен: блокировка, нет сети, отвалился DNS
      console.warn('Адрес недоступен:', order[i], e && e.message);
      lastErr = e;
    }
  }
  throw lastErr || new Error('Ни один адрес не ответил');
}

async function parseVoiceWithAI(text) {
  if (!text.trim()) return;
  
  setVoiceStatus('processing', 'Разбираю запись…');

  try {
    var projectsList = projects.map(function(p) { return { id: p.id, name: p.name }; });
    var today = todayStr();

    var response = await postToParser({
      text: text,
      projects: projectsList,
      today: today
    });

    var data = await response.json().catch(function() { return null; });

    if (!response.ok || !data || data.error) {
      var msg = (data && (data.error || data.details)) || ('HTTP ' + response.status);
      console.error('Ошибка разбора:', msg);
      setVoiceStatus('idle', 'Не получилось разобрать: ' + msg);
      setTimeout(function() { setVoiceStatus('idle', ''); }, 4000);
      return;
    }

    setVoiceStatus('idle', '');
    saveParsed(data);

  } catch (e) {
    console.error('Parse error:', e);
    setVoiceStatus('idle', 'Нет связи с сервисом разбора: ' + (e && e.message ? e.message : e));
    setTimeout(function() { setVoiceStatus('idle', ''); }, 6000);
  }
}

// Записываем сразу, без окна проверки: на телефоне оно не помещалось в экран.
// Поправить можно нажатием на подсказку — она открывает созданную запись.
function saveParsed(data) {
  var type = data.type === 'protocol' || data.type === 'note' ? data.type : 'task';
  var title = (data.title || '').trim();
  if (!title) {
    setVoiceStatus('idle', 'Не понял, что записать');
    setTimeout(function() { setVoiceStatus('idle', ''); }, 4000);
    return;
  }

  var known = projects.some(function(p) { return p.id === data.projectId; });
  var projectId = known ? data.projectId : currentProject;
  var desc = (data.description || '').trim();
  var id;

  if (type === 'task') {
    id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    tasks.push({
      id: id,
      title: title,
      description: desc,
      projectId: projectId,
      done: false,
      priority: ['high', 'normal', 'low'].indexOf(data.priority) !== -1 ? data.priority : 'normal',
      due: data.dueDate || null,
      time: data.time || null,
      createdAt: Date.now(),
      doneAt: null
    });
  } else {
    id = (type === 'protocol' ? 'p_' : 'n_') + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    (type === 'protocol' ? protocols : notes).push({
      id: id,
      title: title,
      content: desc,
      projectId: projectId,
      createdAt: Date.now()
    });
  }

  saveTasks();
  render();
  speakSaved();
  showSavedToast(type, id, title, projectId, data);
}

// Короткая сводка о том, что записано. Нажатие открывает запись для правки.
function showSavedToast(type, id, title, projectId, data) {
  var kindName = type === 'protocol' ? 'Протокол' : type === 'note' ? 'Заметка' : 'Задача';
  var bits = [projectName(projectId)];
  if (data.dueDate) bits.push(humanDate(data.dueDate) + (data.time ? ' ' + data.time : ''));
  if (data.priority === 'high') bits.push('срочно');

  var hint = document.getElementById('mic-hint');
  if (!hint) return;
  hint.textContent = kindName + ': ' + title + ' · ' + bits.filter(Boolean).join(', ') + ' — исправить';
  hint.classList.add('show', 'tappable');
  hint.onclick = function() {
    hideSavedToast();
    if (type === 'task') openTaskModal(id);
    else openEntryModal(type, id);
  };
  clearTimeout(showSavedToast._t);
  showSavedToast._t = setTimeout(hideSavedToast, 7000);
}

function hideSavedToast() {
  var hint = document.getElementById('mic-hint');
  if (!hint) return;
  hint.classList.remove('show', 'tappable');
  hint.onclick = null;
  hint.textContent = '';
}

function humanDate(str) {
  var d = strToDate(str);
  if (!d) return str;
  if (str === todayStr()) return 'сегодня';
  var t = new Date(); t.setDate(t.getDate() + 1);
  if (str === dateToStr(t)) return 'завтра';
  return d.getDate() + ' ' + MONTH_GEN[d.getMonth()];
}

/* ==================== Голосовой ответ после сохранения ==================== */

// Своя запись фразы. Если файла не окажется — приложение проговорит фразу
// системным голосом, поэтому подтверждение не пропадёт в любом случае.
var CONFIRM_SOUND_URL = 'assets/confirm.mp3';
var CONFIRM_PHRASE = 'Мой господин, я всё записала';
var _ttsVoice = null;
var _confirmAudio = null;

function pickRuVoice() {
  if (!window.speechSynthesis) return null;
  var voices = window.speechSynthesis.getVoices() || [];
  var ru = voices.filter(function(v) { return /^ru/i.test(v.lang); });
  if (!ru.length) return null;
  // известные женские русские голоса в разных системах
  var preferred = ['milena', 'katya', 'alyona', 'tatyana', 'google', 'yandex'];
  for (var i = 0; i < preferred.length; i++) {
    var name = preferred[i];
    var hit = ru.filter(function(v) { return v.name.toLowerCase().indexOf(name) !== -1; })[0];
    if (hit) return hit;
  }
  return ru[0];
}

if (window.speechSynthesis) {
  _ttsVoice = pickRuVoice();
  // список голосов подгружается не сразу
  window.speechSynthesis.addEventListener('voiceschanged', function() {
    _ttsVoice = pickRuVoice();
  });
}

function voiceReplyOn() {
  return localStorage.getItem('voiceReplyOff') !== '1';
}

function toggleVoiceReply() {
  localStorage.setItem('voiceReplyOff', voiceReplyOn() ? '1' : '0');
  syncVoiceReplyBtn();
  if (voiceReplyOn()) speakSaved();     // сразу слышно, что включилось
}

function syncVoiceReplyBtn() {
  var b = document.getElementById('voice-reply-btn');
  if (b) b.textContent = 'Ответ голосом: ' + (voiceReplyOn() ? 'вкл' : 'выкл');
}

function speakSaved() {
  if (!voiceReplyOn()) return;

  if (CONFIRM_SOUND_URL) {
    try {
      if (!_confirmAudio) {
        _confirmAudio = new Audio(CONFIRM_SOUND_URL);
        _confirmAudio.preload = 'auto';
      }
      _confirmAudio.currentTime = 0;
      var played = _confirmAudio.play();
      if (played && played.catch) {
        played.catch(function(e) {
          console.warn('Запись не проигралась, говорю голосом системы:', e);
          speakSynth();
        });
      }
      return;
    } catch (e) {
      console.warn(e);
    }
  }

  speakSynth();
}

// запасной вариант — системный голос
function speakSynth() {
  if (!window.speechSynthesis) return;
  var u = new SpeechSynthesisUtterance(CONFIRM_PHRASE);
  u.lang = 'ru-RU';
  u.pitch = 1.35;    // выше обычного — мягче и женственнее
  u.rate = 0.88;     // чуть медленнее
  if (!_ttsVoice) _ttsVoice = pickRuVoice();
  if (_ttsVoice) u.voice = _ttsVoice;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

syncVoiceReplyBtn();

</script>
