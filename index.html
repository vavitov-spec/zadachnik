<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачник — ВЕКТОР</title>
<meta name="theme-color" content="#f5f5f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Задачник">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a18'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --line: #d5d5d7;
    --ink: #1d1d1f;
    --muted: #86868b;
    --soft: #f5f5f7;
    --accent: #0071e3;
    --red: #ff3b30;
    --amber: #ff9500;
    --gutter: 40px;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  button, input, select, textarea { font-family: inherit; }

  /* ---------- Login ---------- */
  #login-page {
    display: flex; align-items: center; justify-content: center;
    height: 100%; background: var(--bg);
  }
  body.authed #login-page { display: none; }
  .login-box {
    width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,.08);
  }
  .login-logo { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-align: center; color: var(--muted); margin-bottom: 16px; }
  .login-box h1 { font-size: 28px; margin: 0 0 28px; text-align: center; font-weight: 600; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 8px; font-weight: 500; }
  .field input {
    width: 100%; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--accent); background: #fff; }
  .btn-primary {
    width: 100%; padding: 14px; border: none; background: var(--accent); color: #fff;
    border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer;
  }
  .btn-primary:hover { background: #0056b3; }
  .link-btn {
    width: 100%; margin-top: 12px; padding: 8px; border: none; background: none;
    color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline;
  }
  #login-error {
    margin-top: 14px; padding: 11px; border-radius: 9px; background: #fdf0f0;
    color: #a33020; font-size: 13px; display: none;
  }

  /* ---------- App shell ---------- */
  #app { display: none; height: 100%; }
  body.authed #app { display: flex; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 200px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 20px 12px 16px;
  }
  .sidebar .logo {
    padding: 0 4px 20px; line-height: 1.3;
    display: flex; align-items: center; gap: 9px;
  }
  .sidebar .logo-mark { width: 22px; height: auto; flex-shrink: 0; display: block; }
  .sidebar .logo-text { display: block; min-width: 0; }
  .sidebar .logo b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .sidebar .logo-text span { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0; }
  .sidebar-nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 6px;
    border: none; background: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: var(--ink); text-align: left; font-weight: 500;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:hover { background: var(--soft); }
  .nav-btn.active { background: var(--soft); color: var(--accent); }
  .nav-btn .nav-count { margin-left: auto; font-size: 12px; color: var(--muted); }
  .nav-btn.active .nav-count { color: var(--accent); }
  .sidebar-header {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;
    font-weight: 600; padding: 0 4px; margin-bottom: 10px; margin-top: 14px;
  }
  .sidebar-projects { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .proj {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 6px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    border: none; background: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: var(--ink); text-align: left;
  }
  .proj:hover { background: var(--soft); }
  .proj.active { background: var(--soft); color: var(--accent); font-weight: 500; }
  .proj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-count {
    font-size: 12px; color: var(--muted); background: transparent; border-radius: 8px;
    padding: 2px 6px; flex-shrink: 0;
  }
  .proj.active .proj-count { color: var(--accent); font-weight: 500; }
  .proj-edit {
    border: none; background: none; color: inherit; cursor: pointer; font-size: 13px;
    padding: 2px 4px; opacity: 0.5; flex-shrink: 0;
  }
  .proj.active .proj-edit { opacity: 0.6; color: var(--accent); }
  .proj-drag {
    flex-shrink: 0; cursor: grab; font-size: 12px; line-height: 1; padding: 3px 1px;
    color: inherit; opacity: .3; letter-spacing: -1px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .proj.active .proj-drag { opacity: .6; }
  .proj.dragging {
    opacity: .75; background: #e6e6e1; box-shadow: 0 3px 10px rgba(0,0,0,.12);
  }
  .proj.dragging .proj-drag { cursor: grabbing; }
  .proj:active { background: #e6e6e1; }
  .proj.active:active { background: var(--ink); }

  /* Hover-эффекты только для мыши. На тач-экранах :hover «залипает»:
     первое касание отрабатывает как наведение, и клик срабатывает лишь со второго раза. */
  @media (hover: hover) and (pointer: fine) {
    .proj:hover { background: #efefeb; }
    .proj.active:hover { background: var(--ink); }
    .proj-edit { opacity: 0; }
    .proj:hover .proj-edit, .proj.active .proj-edit { opacity: .55; }
    .proj-edit:hover { opacity: 1 !important; }
    .task-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .btn-icon:hover { background: #f7f7f5; }
    .sidebar-add button:hover { border-color: #a8a8a2; color: #55554f; }
    #logout-btn:hover { background: #ebebe7; color: var(--ink); }
  }
  .sidebar-add { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .sidebar-add button {
    width: 100%; padding: 10px; border: 1px dashed #c8c8c2; background: none;
    color: var(--muted); border-radius: 9px; font-size: 13px; cursor: pointer;
  }

  .sidebar-footer { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #logout-btn {
    width: 100%; padding: 9px 10px; border: none; background: none; border-radius: 9px;
    color: var(--muted); cursor: pointer; font-size: 13px; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #logout-btn:active { background: #ebebe7; }

  /* ---------- Main ---------- */
  .main { flex: 1; overflow-y: auto; }
  .main-inner { width: 100%; padding: 0 var(--gutter) 110px; }
  header {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
    margin-bottom: 0; padding-bottom: 0; border-bottom: 1px solid var(--line);
    flex-wrap: nowrap; position: sticky; top: 0; background: var(--panel); z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
    margin-left: calc(-1 * var(--gutter)); margin-right: calc(-1 * var(--gutter));
    padding-left: var(--gutter); padding-right: var(--gutter); padding-top: 18px;
  }
  header h1 {
    font-size: 28px; margin: 0; letter-spacing: -0.5px; font-weight: 600;
    flex: 0 0 230px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .view-tabs {
    display: flex; gap: 4px; margin: 0;
    overflow-x: auto; align-items: flex-end; padding-bottom: 0;
  }
  .vtab {
    border: 1px solid var(--line); border-bottom: none;
    background: var(--soft); color: var(--muted); font-size: 14px; white-space: nowrap;
    padding: 10px 16px; cursor: pointer; margin-bottom: 0; border-radius: 10px 10px 0 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; font-weight: 500;
    position: relative; top: 1px;
  }
  .vtab.active {
    background: var(--panel); color: var(--ink); font-weight: 600;
    border-color: var(--line); top: 0; box-shadow: 0 -2px 8px rgba(0,0,0,.05);
  }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--muted); flex-shrink: 0; }
  #save-indicator { min-width: 110px; text-align: right; font-size: 13px; }

  .stats { display: none; }
  .stats .overdue-count { color: var(--red); font-weight: 600; }

  /* ---------- Add task ---------- */
  .add-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px; margin: 18px 0; box-shadow: 0 1px 3px rgba(0,0,0,.05);
    display: flex; gap: 10px; align-items: center;
  }
  .add-title, .add-desc {
    border: 1px solid var(--line); outline: none; font-size: 15px;
    padding: 0 14px; background: var(--soft); border-radius: 10px; height: 44px;
    box-sizing: border-box; min-width: 0;
  }
  .add-title { flex: 1 1 34%; font-weight: 500; }
  .add-desc { flex: 1 1 66%; font-weight: 400; }
  .add-title:focus, .add-desc:focus { outline: none; border-color: var(--accent); background: #fff; }
  .add-row { display: flex; gap: 10px; align-items: center; margin-top: 0; flex-wrap: nowrap; }
  .add-row input[type=date], .add-row select {
    border: 1px solid var(--line); border-radius: 10px; padding: 0 9px;
    font-size: 13px; color: var(--ink); background: var(--soft); height: 44px; flex-shrink: 0;
    box-sizing: border-box;
  }
  .add-row input[type=date] { width: 122px; }
  .add-row select { width: 96px; }
  .add-row input[type=date]:focus, .add-row select:focus {
    outline: none; border-color: var(--accent); background: #fff;
  }
  .add-row .spacer { display: none; }

  /* Пустое поле даты: вместо системного «дд.мм.гггг» показываем серое «без даты» */
  input[type=date].is-empty { position: relative; }
  input[type=date].is-empty::-webkit-datetime-edit { color: transparent; }
  input[type=date].is-empty::before {
    content: 'без даты'; position: absolute; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; white-space: nowrap;
  }
  .add-row input[type=date].is-empty::before { left: 11px; }
  .modal-field input[type=date].is-empty::before { left: 12px; }

  .btn-icon {
    width: 40px; height: 40px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  #voice-btn {
    width: 44px; height: 44px; font-size: 20px; line-height: 1;
    background: var(--soft); border: 1px solid var(--line); color: var(--ink); flex-shrink: 0;
  }
  #voice-btn.listening {
    background: var(--red); border-color: var(--red); color: #fff;
    box-shadow: 0 2px 9px rgba(255,59,48,.4); animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
  .btn-add {
    border: none; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 0 14px; font-size: 14px; font-weight: 500; cursor: pointer; height: 44px;
    flex-shrink: 0; box-sizing: border-box; white-space: nowrap;
  }
  .btn-add:hover { background: #0056b3; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; gap: 0; background: var(--panel);
    border-radius: 0; border-bottom: 1px solid var(--line);
    position: sticky; top: var(--header-height, 76px); z-index: 98;
    margin: 0 calc(-1 * var(--gutter)) 18px; padding: 0 var(--gutter);
  }
  .tab {
    border: none; background: none; color: var(--muted); font-size: 15px;
    padding: 12px 18px; border-radius: 0; cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { background: none; color: var(--ink); font-weight: 500; border-bottom-color: var(--accent); }

  /* ---------- Task list ---------- */
  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task-row {
    display: flex; align-items: flex-start; gap: 12px; background: var(--panel);
    border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: 12px;
    padding: 16px; cursor: pointer; transition: box-shadow .15s, background .15s;
  }
  .task-row:hover { background: var(--soft); }
  .task-row.overdue { border-left-color: var(--red); }
  .task-row.due-today { border-left-color: var(--amber); }
  .task-row.done { opacity: .5; }
  .task-checkbox {
    width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--ink);
    cursor: pointer; flex-shrink: 0;
  }
  .task-main { flex: 1; min-width: 0; }
  .task-title { font-size: 16px; line-height: 1.4; font-weight: 500; }
  .task-row.prio-high .task-title { color: var(--red); }
  .task-row.done.prio-high .task-title { color: var(--muted); }
  .task-row.done .task-title { text-decoration: line-through; opacity: 0.6; }
  .task-desc {
    font-size: 14px; color: var(--muted); margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task-meta { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pill {
    font-size: 12px; padding: 4px 10px; border-radius: 6px; background: var(--soft);
    color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-weight: 500;
  }
  .pill.overdue { background: #ffebee; color: var(--red); font-weight: 600; }
  .pill.today { background: #fff3e0; color: var(--amber); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.high { background: var(--red); }
  .dot.normal { background: var(--amber); }
  .dot.low { background: #c3c3bd; }
  .task-del {
    border: none; background: none; color: #c9c9c3; font-size: 19px; line-height: 1;
    cursor: pointer; padding: 0 2px; flex-shrink: 0;
  }
  .task-del:hover { color: var(--red); }
  .empty-state { text-align: center; color: #b0b0aa; font-size: 14px; padding: 56px 20px; }

  .vtab .vtab-count {
    font-size: 11px; color: var(--muted); background: var(--soft); border-radius: 6px;
    padding: 2px 6px; margin-left: 6px; font-weight: 500;
  }
  .vtab.active .vtab-count { background: var(--accent); color: #fff; }

  #view-today, #view-week, #view-list, #view-protocols, #view-notes, #view-dashboard { display: none; }
  body.global-mode .view-tabs, body.global-mode .add-card { display: none; }
  body.global-dashboard #view-today { display: none; }
  body.global-dashboard #view-dashboard { display: block; }
  body.view-today #view-today, body.view-week #view-week, body.view-list #view-list,
  body.view-protocols #view-protocols, body.view-notes #view-notes { display: block; }
  body.view-protocols .add-card, body.view-notes .add-card { display: none; }

  /* ---------- Компактная карточка задачи (доски «Неделя» и «Сегодня») ---------- */
  .tcard {
    display: flex; align-items: flex-start; gap: 7px; background: #fff;
    border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: 9px;
    padding: 8px 9px; cursor: pointer; font-size: 13px; line-height: 1.35;
  }
  .tcard.overdue { border-left-color: var(--red); }
  .tcard.due-today { border-left-color: var(--amber); }
  .tcard.done { opacity: .5; }
  .tcard.done .tcard-title { text-decoration: line-through; }
  .tcard-grip {
    flex-shrink: 0; cursor: grab; color: var(--muted); opacity: .45; font-size: 12px;
    line-height: 1.3; letter-spacing: -1px; padding: 0 1px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tcard-check { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--ink); cursor: pointer; flex-shrink: 0; }
  .tcard-body { flex: 1; min-width: 0; }
  .tcard-title { word-wrap: break-word; }
  .tcard.prio-high .tcard-title { color: var(--red); font-weight: 500; }
  .tcard.done.prio-high .tcard-title { color: var(--muted); font-weight: 400; }
  .tcard-desc {
    font-size: 12px; color: #85857e; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tcard-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .tcard.drag-source { opacity: .35; pointer-events: none; }
  body.dragging-task { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  body.dragging-task .tcard { cursor: grabbing; }
  .drag-ghost {
    position: fixed; z-index: 3000; pointer-events: none; max-width: 220px;
    background: var(--ink); color: #fff; font-size: 12px; padding: 7px 10px; border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.28); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .drop-hover { background: #eef3ff !important; outline: 2px dashed #2f6fed; outline-offset: -2px; }

  /* ---------- Неделя ---------- */
  .week-bar {
    display: flex; align-items: center; gap: 8px; padding: 6px var(--gutter);
    margin: 0 calc(-1 * var(--gutter)) 10px;
    position: sticky; top: var(--header-height, 76px); background: var(--panel); z-index: 98;
    border-bottom: 1px solid var(--line);
  }
  .week-bar .week-label { font-size: 13px; font-weight: 600; }
  .week-nav {
    border: 1px solid var(--line); background: #fff; border-radius: 7px; cursor: pointer;
    width: 26px; height: 26px; font-size: 14px; line-height: 1; padding: 0; color: #55554f;
  }
  .week-now {
    border: 1px solid var(--line); background: #fff; border-radius: 7px; cursor: pointer;
    height: 26px; padding: 0 10px; font-size: 12px; color: #55554f;
  }
  .week-board { display: flex; gap: 10px; align-items: flex-start; overflow-x: auto; padding-bottom: 10px; }
  .week-col {
    flex: 1 1 0; min-width: 165px; background: var(--soft); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px; display: flex; flex-direction: column; gap: 7px;
  }
  .week-col.is-today { border-color: #c9c9c1; background: #fffdf5; }
  .week-col-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
    font-size: 12px; font-weight: 700; color: #6f6f68; padding: 2px 2px 4px;
  }
  .week-col.is-today .week-col-head { color: var(--ink); }
  .week-col-head .wd { font-size: 11px; font-weight: 500; color: var(--muted); }
  .week-drop { display: flex; flex-direction: column; gap: 7px; min-height: 70px; border-radius: 9px; padding: 2px; }
  .week-empty { font-size: 12px; color: #b5b5ae; text-align: center; padding: 14px 4px; }
  .week-backlog { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  .week-backlog h3 { font-size: 13px; color: var(--ink); font-weight: 600; margin: 0 0 12px; }
  .week-backlog-hint { color: var(--muted); font-weight: 400; }
  .week-backlog-cols { display: flex; gap: 10px; align-items: flex-start; }
  .backlog-col {
    flex: 1 1 0; min-width: 0; background: var(--soft); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px; display: flex; flex-direction: column; gap: 7px;
  }
  .backlog-col-head {
    display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    color: #6f6f68; padding: 2px 2px 4px;
  }
  .backlog-col-head .n { margin-left: auto; font-weight: 500; color: var(--muted); }
  .backlog-drop { display: flex; flex-direction: column; gap: 7px; min-height: 60px; border-radius: 9px; padding: 2px; }

  /* ---------- Сегодня ---------- */
  .today-head {
    margin: 0 calc(-1 * var(--gutter)); padding: 12px var(--gutter); font-size: 14px; color: var(--muted);
    position: sticky; top: var(--header-height, 76px); background: var(--panel); z-index: 98;
    border-bottom: 1px solid var(--line);
  }
  .today-container { display: flex; gap: 20px; }
  .today-hours { flex: 1; min-width: 0; }
  .today-untimed { flex: 1; min-width: 0; }
  .today-hours h3, .today-untimed h3 {
    font-size: 13px; color: var(--ink); font-weight: 600; margin: 0 0 12px; flex-shrink: 0;
  }

  /* На широком экране колонки прокручиваются независимо друг от друга */
  @media (min-width: 1001px) {
    body.view-today .main { overflow: hidden; }
    body.view-today .main-inner { height: 100%; display: flex; flex-direction: column; padding-bottom: 16px; }
    body.view-today header, body.view-today .add-card, body.view-today .today-head { flex-shrink: 0; }
    body.view-today #view-today { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .today-container { flex: 1; min-height: 0; }

  .today-drop { display: flex; flex-direction: column; gap: 7px; min-height: 46px; border-radius: 9px; padding: 3px; }

  /* ---------- Modal ---------- */

  .modal-field textarea, .modal-field input[type=text], .modal-field input[type=date], .modal-field input[type=time], .modal-field select {
    width: 100%; min-width: 0; max-width: 100%; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--soft);
  }
  .modal-row .modal-field input[type=date], .modal-row .modal-field input[type=time],
  .modal-row .modal-field select { padding: 12px 10px; font-size: 15px; }
  .modal-field textarea:focus, .modal-field input[type=text]:focus, .modal-field input[type=date]:focus, .modal-field input[type=time]:focus, .modal-field select:focus {
    outline: none; border-color: var(--accent); background: #fff;
  }
  .modal-field textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
  .modal-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .modal-row .modal-field { flex: 1 1 130px; min-width: 0; }
  .check-row {
    display: flex; align-items: center; gap: 12px; font-size: 15px; cursor: pointer;

  .btn-delete { background: #ffebee; color: var(--red); flex: 0 0 auto; }

  .btn-save { background: var(--accent); color: #fff; flex: 1; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {

<script>
(function() {
  var VER = '10.12.0';
  var scripts = [
    'https://www.gstatic.com/firebasejs/' + VER + '/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/' + VER + '/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/' + VER + '/firebase-firestore-compat.js'
  ];
  function loadNext(i) {
    if (i >= scripts.length) { initFirebase(); return; }
    var s = document.createElement('script');
    s.src = scripts[i];
    s.onload = function() { loadNext(i + 1); };
    s.onerror = function() { console.error('Failed to load Firebase script:', scripts[i]); loadNext(i + 1); };
    document.head.appendChild(s);
  }
  loadNext(0);
})();

var tasks = [];
var projects = [];
var currentProject = null;
var filter = 'active';
var currentView = 'list';          // today | week | list | protocols | notes
var globalView = null;             // null — обычный проект; 'today' | 'dashboard' — сводные разделы
var weekOffset = 0;                // 0 — текущая неделя
var notes = [];
var protocols = [];
var firebaseUid = null;
var recognition = null;
var isListening = false;
var currentTaskId = null;

// Инициализация Web Speech API
if (typeof webkitSpeechRecognition !== 'undefined') {
  recognition = new webkitSpeechRecognition();
  recognition.lang = 'ru-RU';
  recognition.continuous = false;
  recognition.onstart = function() {
    isListening = true;
    document.getElementById('voice-btn').classList.add('listening');
  };
  recognition.onend = function() {
    isListening = false;
    document.getElementById('voice-btn').classList.remove('listening');
  };
  recognition.onerror = function(e) {
    console.error('Speech recognition error:', e.error);
    document.getElementById('voice-btn').classList.remove('listening');
    alert('Ошибка распознавания речи: ' + e.error);
  };
  recognition.onresult = function(e) {
    var transcript = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    var titleEl = document.getElementById('new-title');
    titleEl.value = (titleEl.value.trim() + ' ' + transcript.trim()).trim();
    titleEl.focus();
    addTask();
  };
}

function initFirebase() {
  firebase.initializeApp({
    apiKey: "AIzaSyDXkHVg3ucKGiG6QF3SFxds7MuTJ95Wx60",
    authDomain: "bdds-1.firebaseapp.com",
    projectId: "bdds-1",
    storageBucket: "bdds-1.firebasestorage.app",
    messagingSenderId: "94953276486",
    appId: "1:94953276486:web:5c211765490485a9cd7647"
  });
  window.db = firebase.firestore();
  window.auth = firebase.auth();

  var _unsubAuth = window.auth.onAuthStateChanged(function(user) {
    _unsubAuth();
    if (user) {
      firebaseUid = user.uid;
      loadTasks().then(showApp);
    } else {
      showLogin();
    }
  });
}

function _lsKey() { return firebaseUid ? ('tasks_cache_' + firebaseUid) : 'tasks_cache'; }

function loadTasks() {
  return new Promise(function(resolve) {
    var lsData = null;
    try {
      var raw = localStorage.getItem(_lsKey());
      if (raw) lsData = JSON.parse(raw);
    } catch(e) {}
    var lsValid = lsData && Array.isArray(lsData.tasks);

    function apply(d) {
      tasks = (d && Array.isArray(d.tasks)) ? d.tasks : [];
      projects = (d && Array.isArray(d.projects)) ? d.projects : [];
      notes = (d && Array.isArray(d.notes)) ? d.notes : [];
      protocols = (d && Array.isArray(d.protocols)) ? d.protocols : [];
      if (d && d.currentView) currentView = d.currentView;
      globalView = (d && d.globalView) || null;
      if (projects.length === 0) {
        projects = [{id: 'default', name: 'Основное'}];
      }
      currentProject = projects[0].id;
    }

    var settled = false;
    var timer = setTimeout(function() {
      if (settled) return;
      settled = true;
      apply(lsData);
      resolve();
    }, 6000);

    window.db.doc('tasks/' + firebaseUid).get()
      .then(function(snap) {
        var fbData = snap.exists ? snap.data() : null;
        var fbValid = fbData && Array.isArray(fbData.tasks);
        var d = null;
        if (fbValid && lsValid) {
          d = (lsData.updatedAt || 0) > (fbData.updatedAt || 0) ? lsData : fbData;
        } else if (fbValid) {
          d = fbData;
        } else if (lsValid) {
          d = lsData;
        }
        if (settled) return;
        settled = true; clearTimeout(timer);
        apply(d);
        resolve();
      })
      .catch(function(e) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        console.error('[loadTasks] server error, fallback to localStorage:', e);
        apply(lsData);
        resolve();
      });
  });
}

var _saveTimer = null;
function _setSaveIndicator(state) {
  var el = document.getElementById('save-indicator');
  if (!el) return;
  if (state === 'saving') { el.textContent = '⏳ Сохранение…'; el.style.color = '#aaa'; }
  else if (state === 'saved') { el.textContent = '✓ Сохранено'; el.style.color = '#0a6e4e'; setTimeout(function(){ el.textContent=''; }, 2000); }
  else { el.textContent = '⚠ Ошибка сохранения'; el.style.color = '#c0392b'; }
}

function saveTasks() {
  var payload = {
    tasks: tasks, projects: projects, notes: notes, protocols: protocols,
    currentProject: currentProject, currentView: currentView, globalView: globalView, updatedAt: Date.now()
  };
  try { localStorage.setItem(_lsKey(), JSON.stringify(payload)); } catch(e) {}
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function() {
    if (!firebaseUid) return;
    _setSaveIndicator('saving');
    window.db.doc('tasks/' + firebaseUid).set(payload)
      .then(function() { _setSaveIndicator('saved'); })
      .catch(function(e) { console.error('Save error:', e); _setSaveIndicator('error'); });
  }, 500);
}

/* ---------- Перетаскивание проектов в левом меню ---------- */
var _projDrag = null;
var _projDragMoved = false;

function projDragStart(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  var row = e.currentTarget.parentNode;
  var list = document.getElementById('projects-list');
  _projDrag = {
    row: row,
    list: list,
    horizontal: getComputedStyle(list).flexDirection === 'row',
    moved: false
  };
  _projDragMoved = false;
  row.classList.add('dragging');
  try { list.setPointerCapture(e.pointerId); } catch (_) {}
  list.addEventListener('pointermove', projDragMove);
  list.addEventListener('pointerup', projDragEnd);
  list.addEventListener('pointercancel', projDragEnd);
}

function projDragMove(e) {
  var d = _projDrag;
  if (!d) return;
  e.preventDefault();
  d.moved = true;
  var pos = d.horizontal ? e.clientX : e.clientY;
  var others = Array.prototype.filter.call(
    d.list.querySelectorAll('.proj'),
    function(r) { return r !== d.row; }
  );
  var before = null;
  for (var i = 0; i < others.length; i++) {
    var b = others[i].getBoundingClientRect();
    var mid = d.horizontal ? b.left + b.width / 2 : b.top + b.height / 2;
    if (pos < mid) { before = others[i]; break; }
  }
  if (before) d.list.insertBefore(d.row, before);
  else d.list.appendChild(d.row);
}

function projDragEnd(e) {
  var d = _projDrag;
  if (!d) return;
  _projDrag = null;
  d.row.classList.remove('dragging');
  d.list.removeEventListener('pointermove', projDragMove);
  d.list.removeEventListener('pointerup', projDragEnd);
  d.list.removeEventListener('pointercancel', projDragEnd);
  try { d.list.releasePointerCapture(e.pointerId); } catch (_) {}
  if (!d.moved) return;

  // гасим клик, который браузер пошлёт строке сразу после перетаскивания
  _projDragMoved = true;
  setTimeout(function() { _projDragMoved = false; }, 0);

  var order = Array.prototype.map.call(d.list.querySelectorAll('.proj'),
    function(r) { return r.dataset.id; });
  var ordered = [];
  order.forEach(function(id) {
    var p = projects.find(function(x) { return x.id === id; });
    if (p && ordered.indexOf(p) === -1) ordered.push(p);
  });
  projects.forEach(function(p) { if (ordered.indexOf(p) === -1) ordered.push(p); });
  projects = ordered;
  saveTasks();
  render();
}

function addProject() {
  var name = prompt('Название проекта:');
  if (!name || !name.trim()) return;
  projects.push({ id: 'p_' + Date.now(), name: name.trim() });
  currentProject = projects[projects.length - 1].id;
  saveTasks();
  render();
}

function renameProject(id) {
  var p = projects.find(function(x) { return x.id === id; });
  if (!p) return;
  var name = prompt('Название проекта (очистите поле, чтобы удалить проект):', p.name);
  if (name === null) return;
  if (!name.trim()) {
    if (projects.length === 1) { alert('Нельзя удалить единственный проект'); return; }
    var n = tasks.filter(function(t) { return t.projectId === id; }).length;
    var np = protocols.filter(function(x) { return x.projectId === id; }).length;
    var nn = notes.filter(function(x) { return x.projectId === id; }).length;
    var what = [];
    if (n) what.push(n + ' задач');
    if (np) what.push(np + ' протоколов');
    if (nn) what.push(nn + ' заметок');
    var msg = 'Удалить проект «' + p.name + '»?';
    if (what.length) msg += '\n\nВместе с ним удалится: ' + what.join(', ') + '. Отменить будет нельзя.';
    if (!confirm(msg)) return;
    tasks = tasks.filter(function(t) { return t.projectId !== id; });
    notes = notes.filter(function(n) { return n.projectId !== id; });
    protocols = protocols.filter(function(pr) { return pr.projectId !== id; });
    projects = projects.filter(function(x) { return x.id !== id; });
    if (currentProject === id) currentProject = projects[0].id;
  } else {
    p.name = name.trim();
  }
  saveTasks();
  render();
}

function toggleDone(id) {
  var t = tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  saveTasks();
  render();
}

function deleteTask(id) {
  var t = tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  if (!confirm('Удалить задачу «' + t.title + '»?')) return;
  tasks = tasks.filter(function(x) { return x.id !== id; });
  saveTasks();
  render();
}

}

function toggleVoice() {

    alert('Голосовой ввод не поддерживается в вашем браузере');
    return;
  }

function saveTaskModal() {
  if (!currentTaskId) return;

  if (!t) return;
  t.title = document.getElementById('task-title-input').value.trim() || t.title;
  t.description = document.getElementById('task-desc-input').value;
  t.due = document.getElementById('task-due-input').value || null;
  t.time = document.getElementById('task-time-input').value || null;
  if (!t.due) t.time = null;
  t.priority = document.getElementById('task-prio-input').value;
  t.projectId = document.getElementById('task-project-input').value || t.projectId;
  var wasDone = t.done;
  t.done = document.getElementById('task-done-input').checked;
  if (!wasDone && t.done) t.doneAt = Date.now();
  else if (wasDone && !t.done) t.doneAt = null;

}

function deleteCurrentTask() {

/* ==================== Разделы: Сегодня / Неделя / Список / Протоколы / Заметки ==================== */

var VIEW_LABELS = {
  today: 'Сегодня', week: 'Неделя', list: 'Список',
  protocols: 'Протоколы', notes: 'Заметки'
};
var DAY_SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
var MONTH_GEN = ['января','февраля','марта','апреля','мая','июня',
                 'июля','августа','сентября','октября','ноября','декабря'];
var _weekDayStrs = [];
var HOUR_FROM = 9;
var HOUR_TO = 21;

function setView(v) {
  currentView = v;
  weekOffset = 0;
  saveTasks();
  render();
}

function pad2(n) { return String(n).padStart(2, '0'); }

function dateToStr(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function strToDate(str) {
  var a = str.split('-');
  return new Date(+a[0], +a[1] - 1, +a[2]);
}

function mondayOf(offsetWeeks) {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  var dow = (d.getDay() + 6) % 7;            // 0 = понедельник
  d.setDate(d.getDate() - dow + offsetWeeks * 7);
  return d;
}

function shiftWeek(n) {
  weekOffset = (n === 0) ? 0 : weekOffset + n;
  render();
}

function projectTasks() {
  if (globalView) return tasks.slice();          // сводный раздел — все проекты
  return tasks.filter(function(t) { return t.projectId === currentProject; });
}

function projectName(id) {
  var p = projects.find(function(x) { return x.id === id; });
  return p ? p.name : '';
}

function renderViewTabs() {
  document.body.classList.remove('view-today', 'view-week', 'view-list', 'view-protocols', 'view-notes');
  document.body.classList.toggle('global-mode', !!globalView);
  document.body.classList.toggle('global-dashboard', globalView === 'dashboard');
  // сводный «Сегодня» показывается тем же блоком, что и вкладка проекта
  document.body.classList.add('view-' + (globalView === 'today' ? 'today' : currentView));

  document.querySelectorAll('.nav-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.nav === globalView);
  });
  if (globalView) return;

  var today = todayStr();
  var mine = projectTasks();
  var counts = {
    today: mine.filter(function(t) { return !t.done && t.due === today; }).length,
    week: 0,
    list: mine.filter(function(t) { return !t.done; }).length,
    protocols: protocols.filter(function(e) { return e.projectId === currentProject; }).length,
    notes: notes.filter(function(e) { return e.projectId === currentProject; }).length
  };
  var mon = mondayOf(0), weekDays = [];
  for (var i = 0; i < 5; i++) {
    var d = new Date(mon); d.setDate(mon.getDate() + i);
    weekDays.push(dateToStr(d));
  }
  counts.week = mine.filter(function(t) { return !t.done && t.due && weekDays.indexOf(t.due) !== -1; }).length;

  document.querySelectorAll('.vtab').forEach(function(btn) {
    var v = btn.dataset.view;
    btn.classList.toggle('active', v === currentView);
    btn.innerHTML = '';
    btn.appendChild(document.createTextNode(VIEW_LABELS[v]));
    if (counts[v] > 0) {
      var c = document.createElement('span');
      c.className = 'vtab-count';
      c.textContent = counts[v];
      btn.appendChild(c);
    }
  });
}

/* ---------- Компактная карточка задачи для досок ---------- */
function buildTaskCard(t, opts) {
  opts = opts || {};
  if (globalView) opts.showProject = true;
  var today = todayStr();
  var card = document.createElement('div');
  card.className = 'tcard' + (t.done ? ' done' : '') + (t.priority === 'high' ? ' prio-high' : '');
  if (!t.done && t.due) {
    if (t.due < today) card.classList.add('overdue');
    else if (t.due === today) card.classList.add('due-today');
  }
  card.dataset.id = t.id;
  card.onclick = function() { if (!_taskDragMoved) openTaskModal(t.id); };
  card.addEventListener('pointerdown', function(e) { taskPointerDown(e, t.id, card, false); });

  var grip = document.createElement('span');
  grip.className = 'tcard-grip';
  grip.textContent = '⠿';
  grip.title = 'Потяните, чтобы перенести задачу';
  grip.addEventListener('pointerdown', function(e) { taskPointerDown(e, t.id, card, true); });
  grip.addEventListener('click', function(e) { e.stopPropagation(); e.preventDefault(); });
  card.appendChild(grip);

  var cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'tcard-check';
  cb.checked = t.done;
  cb.onclick = function(e) { e.stopPropagation(); toggleDone(t.id); };
  card.appendChild(cb);

  var body = document.createElement('div');
  body.className = 'tcard-body';

  var title = document.createElement('div');
  title.className = 'tcard-title';
  title.textContent = t.title;
  body.appendChild(title);

  if (opts.showDesc && t.description && t.description.trim()) {
    var desc = document.createElement('div');
    desc.className = 'tcard-desc';
    desc.textContent = t.description.trim();
    body.appendChild(desc);
  }

  var meta = document.createElement('div');
  meta.className = 'tcard-meta';
  var any = false;

  if (t.priority && t.priority !== 'normal') {
    var pr = document.createElement('span');
    pr.className = 'pill';
    var dot = document.createElement('span');
    dot.className = 'dot ' + t.priority;
    pr.appendChild(dot);
    pr.appendChild(document.createTextNode(prioLabel[t.priority]));
    meta.appendChild(pr); any = true;
  }
  if (opts.showDate && t.due) {
    var dp = document.createElement('span');
    dp.className = 'pill';
    var label = formatDue(t.due);
    if (!t.done && t.due < today) { dp.className += ' overdue'; label = 'Просрочено · ' + label; }
    else if (!t.done && t.due === today) { dp.className += ' today'; label = 'Сегодня'; }
    dp.textContent = label;
    meta.appendChild(dp); any = true;
  }
  if (opts.showProject) {
    var pp = document.createElement('span');
    pp.className = 'pill';
    pp.textContent = projectName(t.projectId);
    meta.appendChild(pp); any = true;
  }
  if (opts.showTime && t.time) {
    var tp = document.createElement('span');
    tp.className = 'pill';
    tp.textContent = t.time;
    meta.appendChild(tp); any = true;
  }
  if (any) body.appendChild(meta);

  card.appendChild(body);
  return card;
}

function sortForBoard(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  if ((a.time || '') !== (b.time || '')) {
    if (!a.time) return 1;
    if (!b.time) return -1;
    return a.time < b.time ? -1 : 1;
  }
  if (prioRank[a.priority] !== prioRank[b.priority]) return prioRank[a.priority] - prioRank[b.priority];
  return a.createdAt - b.createdAt;
}

/* ---------- Вкладка «Неделя» ---------- */
function renderWeek() {
  var mon = mondayOf(weekOffset);
  var days = [];
  for (var i = 0; i < 5; i++) {
    var d = new Date(mon); d.setDate(mon.getDate() + i);
    days.push({ date: d, str: dateToStr(d), short: DAY_SHORT[i] });
  }

  var fri = days[4].date;
  var label = mon.getDate() + (mon.getMonth() === fri.getMonth() ? '' : ' ' + MONTH_GEN[mon.getMonth()]) +
              ' – ' + fri.getDate() + ' ' + MONTH_GEN[fri.getMonth()];
  if (weekOffset === 0) label += ' · текущая неделя';
  document.getElementById('week-label').textContent = label;

  var today = todayStr();
  var mine = projectTasks().filter(function(t) { return !t.done; });
  _weekDayStrs = days.map(function(d) { return d.str; });

  var board = document.getElementById('week-board');
  board.innerHTML = '';

  var cols = days.map(function(d) {
    return { key: 'day', title: d.short, sub: pad2(d.date.getDate()) + '.' + pad2(d.date.getMonth() + 1), date: d.str };
  });

  cols.forEach(function(c) {
    var col = document.createElement('div');
    col.className = 'week-col' + (c.date === today ? ' is-today' : '');

    var head = document.createElement('div');
    head.className = 'week-col-head';
    var h1 = document.createElement('span');
    h1.textContent = c.title;
    var h2 = document.createElement('span');
    h2.className = 'wd';
    h2.textContent = c.sub;
    head.appendChild(h1); head.appendChild(h2);
    col.appendChild(head);

    var drop = document.createElement('div');
    drop.className = 'week-drop';
    drop.dataset.drop = 'day';
    drop.dataset.date = c.date;

    var items = mine.filter(function(t) { return t.due === c.date; });
    items.sort(sortForBoard);

    if (items.length === 0) {
      var e = document.createElement('div');
      e.className = 'week-empty';
      e.textContent = '—';
      drop.appendChild(e);
    } else {
      items.forEach(function(t) {
        drop.appendChild(buildTaskCard(t, { showTime: true }));
      });
    }

    col.appendChild(drop);
    board.appendChild(col);
  });

  // ---- Полка: всё, что не попало в показанные пять дней, по важности ----
  var backlog = document.getElementById('week-backlog');
  backlog.innerHTML = '';
  var loose = mine.filter(function(t) { return !t.due || _weekDayStrs.indexOf(t.due) === -1; });
  loose.sort(function(a, b) {
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;          // с датой — выше
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    return a.createdAt - b.createdAt;
  });

  ['high', 'normal', 'low'].forEach(function(prio) {
    var col = document.createElement('div');
    col.className = 'backlog-col';

    var items = loose.filter(function(t) { return (t.priority || 'normal') === prio; });

    var head = document.createElement('div');
    head.className = 'backlog-col-head';
    var dot = document.createElement('span');
    dot.className = 'dot ' + prio;
    head.appendChild(dot);
    head.appendChild(document.createTextNode(prioLabel[prio]));
    var n = document.createElement('span');
    n.className = 'n';
    n.textContent = items.length || '';
    head.appendChild(n);
    col.appendChild(head);

    var drop = document.createElement('div');
    drop.className = 'backlog-drop';
    drop.dataset.drop = 'backlog';
    drop.dataset.prio = prio;

    if (items.length === 0) {
      var e = document.createElement('div');
      e.className = 'week-empty';
      e.textContent = '—';
      drop.appendChild(e);
    } else {
      items.forEach(function(t) { drop.appendChild(buildTaskCard(t, { showDate: true, showTime: true })); });
    }

    col.appendChild(drop);
    backlog.appendChild(col);
  });
}

/* ---------- Вкладка «Сегодня» ---------- */
function renderToday() {
  var today = todayStr();
  var d = new Date();
  document.getElementById('today-head').textContent =
    DAY_SHORT[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MONTH_GEN[d.getMonth()];

  var mine = projectTasks().filter(function(t) { return t.due === today; });

  var untimedEl = document.getElementById('today-untimed');
  untimedEl.innerHTML = '';
  untimedEl.dataset.date = today;
  var untimed = mine.filter(function(t) { return !t.time; }).sort(sortForBoard);
  if (untimed.length === 0) {
    untimedEl.innerHTML = '<div class="week-empty">Перетащите сюда задачу, чтобы снять время</div>';
  } else {
    untimed.forEach(function(t) { untimedEl.appendChild(buildTaskCard(t, { showDesc: true })); });
  }

  var hoursEl = document.getElementById('today-hours');
  hoursEl.innerHTML = '';
  var nowHour = new Date().getHours();

  for (var h = HOUR_FROM; h <= HOUR_TO; h++) {
    var row = document.createElement('div');
    row.className = 'hour-row' + (h === nowHour ? ' is-now' : '');

    var lab = document.createElement('div');
    lab.className = 'hour-label';
    lab.textContent = pad2(h) + ':00';
    row.appendChild(lab);

    var slot = document.createElement('div');
    slot.className = 'hour-slot';
    slot.dataset.drop = 'hour';
    slot.dataset.date = today;
    slot.dataset.time = pad2(h) + ':00';

    // задачи раньше первой и позже последней строки не теряем — прижимаем к краю
    var inHour = mine.filter(function(t) {
      if (!t.time) return false;
      var th = parseInt(t.time.split(':')[0], 10);
      if (h === HOUR_FROM) return th <= HOUR_FROM;
      if (h === HOUR_TO) return th >= HOUR_TO;
      return th === h;
    }).sort(sortForBoard);
    inHour.forEach(function(t) { slot.appendChild(buildTaskCard(t, { showDesc: true, showTime: true })); });

    row.appendChild(slot);
    hoursEl.appendChild(row);
  }
}

/* ---------- Перетаскивание задач между колонками и часами ---------- */
var _taskDrag = null;
var _taskDragMoved = false;
var _taskPending = null;

// Тянуть плашку можно за любое место. Чтобы это не мешало ни открытию задачи,
// ни прокрутке страницы: мышью перетаскивание начинается после сдвига на 5 пикселей,
// пальцем — после удержания четверть секунды (сдвинул раньше — значит, листаешь).
var DRAG_MOUSE_SLOP = 5;
var DRAG_TOUCH_SLOP = 10;
var DRAG_HOLD_MS = 250;

function taskPointerDown(e, taskId, card, immediate) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target && e.target.classList && e.target.classList.contains('tcard-check')) return;
  clearTaskPending();

  _taskPending = {
    id: taskId, card: card, pointerId: e.pointerId, type: e.pointerType,
    x: e.clientX, y: e.clientY, timer: null
  };
  document.addEventListener('pointermove', taskMoveRouter, { passive: false });
  document.addEventListener('pointerup', taskUpRouter);
  document.addEventListener('pointercancel', taskUpRouter);

  if (immediate) {
    e.preventDefault();
    e.stopPropagation();
    beginTaskDrag(e.clientX, e.clientY, e.pointerId, card, taskId);
  } else if (e.pointerType !== 'mouse') {
    _taskPending.timer = setTimeout(function() {
      var pd = _taskPending;
      if (pd) beginTaskDrag(pd.x, pd.y, pd.pointerId, pd.card, pd.id);
    }, DRAG_HOLD_MS);
  }
}

function clearTaskPending() {
  if (_taskPending && _taskPending.timer) clearTimeout(_taskPending.timer);
  _taskPending = null;
}

function taskMoveRouter(e) {
  if (_taskDrag) { taskDragMove(e); return; }
  var pd = _taskPending;
  if (!pd || e.pointerId !== pd.pointerId) return;
  var dx = e.clientX - pd.x, dy = e.clientY - pd.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (pd.type === 'mouse') {
    if (dist > DRAG_MOUSE_SLOP) beginTaskDrag(e.clientX, e.clientY, pd.pointerId, pd.card, pd.id);
  } else if (dist > DRAG_TOUCH_SLOP) {
    clearTaskPending();          // палец поехал раньше времени — это прокрутка
  }
}

function taskUpRouter(e) {
  if (_taskDrag) taskDragEnd(e);
  clearTaskPending();
  document.removeEventListener('pointermove', taskMoveRouter);
  document.removeEventListener('pointerup', taskUpRouter);
  document.removeEventListener('pointercancel', taskUpRouter);
}

function beginTaskDrag(x, y, pointerId, card, taskId) {
  clearTaskPending();
  var t = tasks.find(function(item) { return item.id === taskId; });

  var ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = t ? t.title : '';
  document.body.appendChild(ghost);

  _taskDrag = { id: taskId, card: card, ghost: ghost, zone: null, moved: false, pointerId: pointerId };
  _taskDragMoved = false;
  card.classList.add('drag-source');
  document.body.classList.add('dragging-task');
  moveGhostTo(x, y);
}

function moveGhostTo(x, y) {
  if (!_taskDrag) return;
  _taskDrag.ghost.style.left = (x + 14) + 'px';
  _taskDrag.ghost.style.top = (y - 12) + 'px';
}

function taskDragMove(e) {
  if (!_taskDrag) return;
  e.preventDefault();
  _taskDrag.moved = true;
  moveGhostTo(e.clientX, e.clientY);

  var under = document.elementFromPoint(e.clientX, e.clientY);
  var zone = under ? under.closest('[data-drop]') : null;
  if (zone !== _taskDrag.zone) {
    if (_taskDrag.zone) _taskDrag.zone.classList.remove('drop-hover');
    _taskDrag.zone = zone;
    if (zone) zone.classList.add('drop-hover');
  }
}

function taskDragEnd(e) {
  var d = _taskDrag;
  if (!d) return;
  _taskDrag = null;

  document.body.classList.remove('dragging-task');
  if (d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  d.card.classList.remove('drag-source');
  if (d.zone) d.zone.classList.remove('drop-hover');

  if (!d.moved) return;
  _taskDragMoved = true;
  setTimeout(function() { _taskDragMoved = false; }, 0);
  if (!d.zone) return;

  var t = tasks.find(function(x) { return x.id === d.id; });
  if (!t) return;
  var kind = d.zone.dataset.drop;
  if (kind === 'backlog') {
    t.priority = d.zone.dataset.prio || t.priority;
    // снимаем день только у задач текущей недели: дату другой недели не теряем
    if (t.due && _weekDayStrs.indexOf(t.due) !== -1) { t.due = null; t.time = null; }
  }
  else if (kind === 'day') { t.due = d.zone.dataset.date; }
  else if (kind === 'untimed') { t.due = d.zone.dataset.date; t.time = null; }
  else if (kind === 'hour') { t.due = d.zone.dataset.date; t.time = d.zone.dataset.time; }
  saveTasks();
  render();
}

/* ==================== Дашборд по всем проектам ==================== */
function renderDashboard() {
  var today = todayStr();
  var active = tasks.filter(function(t) { return !t.done; });
  var overdue = active.filter(function(t) { return t.due && t.due < today; });
  var todays = active.filter(function(t) { return t.due === today; });

  var tiles = [
    { k: 'Активных задач', v: active.length, warn: false },
    { k: 'На сегодня', v: todays.length, warn: false },
    { k: 'Просрочено', v: overdue.length, warn: overdue.length > 0 }
  ];
  var tilesEl = document.getElementById('dash-tiles');
  tilesEl.innerHTML = '';
  tiles.forEach(function(x) {
    var d = document.createElement('div');
    d.className = 'dash-tile' + (x.warn ? ' warn' : '');
    d.innerHTML = '<div class="v"></div><div class="k"></div>';
    d.querySelector('.v').textContent = x.v;
    d.querySelector('.k').textContent = x.k;
    tilesEl.appendChild(d);
  });

  // просроченное — от самого давнего
  var ovEl = document.getElementById('dash-overdue');
  ovEl.innerHTML = '';
  if (overdue.length === 0) {
    ovEl.innerHTML = '<div class="empty-state">Просроченных задач нет</div>';
  } else {
    var list = document.createElement('div');
    list.className = 'dash-list';
    overdue.slice().sort(function(a, b) { return a.due < b.due ? -1 : 1; })
      .forEach(function(t) { list.appendChild(buildTaskCard(t, { showDate: true, showTime: true })); });
    ovEl.appendChild(list);
  }

  // ближайшая неделя по дням
  var upEl = document.getElementById('dash-upcoming');
  upEl.innerHTML = '';
  var shown = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + i);
    var str = dateToStr(d);
    var items = active.filter(function(t) { return t.due === str; }).sort(sortForBoard);
    if (items.length === 0) continue;
    shown += items.length;

    var h = document.createElement('div');
    h.className = 'dash-day';
    h.textContent = (str === today ? 'Сегодня' : DAY_SHORT[(d.getDay() + 6) % 7] + ', ' +
                     d.getDate() + ' ' + MONTH_GEN[d.getMonth()]);
    upEl.appendChild(h);

    var wrap = document.createElement('div');
    wrap.className = 'dash-list';
    items.forEach(function(t) { wrap.appendChild(buildTaskCard(t, { showTime: true })); });
    upEl.appendChild(wrap);
  }
  if (shown === 0) upEl.innerHTML = '<div class="empty-state">На ближайшую неделю ничего не запланировано</div>';

  // разбивка по проектам
  var prEl = document.getElementById('dash-projects');
  prEl.innerHTML = '';
  projects.forEach(function(p) {
    var mine = tasks.filter(function(t) { return t.projectId === p.id && !t.done; });
    var od = mine.filter(function(t) { return t.due && t.due < today; }).length;
    var td = mine.filter(function(t) { return t.due === today; }).length;

    var row = document.createElement('button');
    row.className = 'dash-proj';
    row.onclick = function() { selectProject(p.id); };

    var nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = p.name;
    row.appendChild(nm);

    var a = document.createElement('span');
    a.className = 'num';
    a.textContent = 'активных: ' + mine.length;
    row.appendChild(a);

    if (td > 0) {
      var b = document.createElement('span');
      b.className = 'num';
      b.textContent = 'на сегодня: ' + td;
      row.appendChild(b);
    }
    if (od > 0) {
      var c = document.createElement('span');
      c.className = 'num warn';
      c.textContent = 'просрочено: ' + od;
      row.appendChild(c);
    }
    prEl.appendChild(row);
  });
}

/* ==================== Протоколы и заметки ==================== */
var currentEntryKind = 'protocol';
var currentEntryId = null;

function entryStore(kind) { return kind === 'note' ? notes : protocols; }

function renderEntries(kind) {
  var listEl = document.getElementById(kind === 'note' ? 'notes-list' : 'protocols-list');
  listEl.innerHTML = '';
  var items = entryStore(kind).filter(function(e) { return e.projectId === currentProject; });
  items.sort(function(a, b) {
    if ((a.date || '') !== (b.date || '')) return (a.date || '') < (b.date || '') ? 1 : -1;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty-state">' +
      (kind === 'note' ? 'Заметок пока нет' : 'Протоколов пока нет') + '</div>';
    return;
  }

  items.forEach(function(en) {
    var card = document.createElement('div');
    card.className = 'entry-card';
    card.onclick = function() { openEntryModal(kind, en.id); };

    var dt = document.createElement('div');
    dt.className = 'entry-date';
    dt.textContent = en.date ? formatDue(en.date) : 'без даты';
    card.appendChild(dt);

    var ti = document.createElement('div');
    ti.className = 'entry-title';
    ti.textContent = en.title || 'Без заголовка';
    card.appendChild(ti);

    if (kind === 'protocol' && en.who && en.who.trim()) {
      var wh = document.createElement('div');
      wh.className = 'entry-who';
      wh.textContent = 'Участники: ' + en.who.trim();
      card.appendChild(wh);
    }

    if (en.text && en.text.trim()) {
      var sn = document.createElement('div');
      sn.className = 'entry-snippet';
      sn.textContent = en.text.trim();
      card.appendChild(sn);
    }

    listEl.appendChild(card);
  });
}

function openEntryModal(kind, id) {
  currentEntryKind = kind;
  currentEntryId = id;
  var isNote = kind === 'note';
  var en = id ? entryStore(kind).find(function(x) { return x.id === id; }) : null;

  document.getElementById('entry-modal-title').textContent =
    isNote ? (id ? 'Заметка' : 'Новая заметка') : (id ? 'Протокол' : 'Новый протокол');
  document.getElementById('entry-who-field').style.display = isNote ? 'none' : '';
  document.getElementById('entry-text-label').textContent = isNote ? 'Текст' : 'Что обсудили и решили';
  document.getElementById('entry-date').value = en ? (en.date || '') : todayStr();
  document.getElementById('entry-who').value = en ? (en.who || '') : '';
  document.getElementById('entry-title').value = en ? (en.title || '') : '';
  document.getElementById('entry-text').value = en ? (en.text || '') : '';
  syncDatePlaceholder(document.getElementById('entry-date'));

  document.querySelector('#entry-modal .btn-delete').style.display = id ? '' : 'none';
  document.getElementById('entry-modal').classList.add('visible');
  setTimeout(function() { document.getElementById('entry-title').focus(); }, 30);
}

function closeEntryModal() {
  document.getElementById('entry-modal').classList.remove('visible');
  currentEntryId = null;
}

function saveEntryModal() {
  var kind = currentEntryKind;
  var store = entryStore(kind);
  var data = {
    date: document.getElementById('entry-date').value || null,
    who: document.getElementById('entry-who').value.trim(),
    title: document.getElementById('entry-title').value.trim(),
    text: document.getElementById('entry-text').value
  };
  if (!data.title && !data.text.trim()) { closeEntryModal(); return; }

  if (currentEntryId) {
    var en = store.find(function(x) { return x.id === currentEntryId; });
    if (en) {
      en.date = data.date; en.who = data.who; en.title = data.title; en.text = data.text;
      en.updatedAt = Date.now();
    }
  } else {
    store.push({
      id: (kind === 'note' ? 'n_' : 'pr_') + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      projectId: currentProject,
      date: data.date, who: data.who, title: data.title, text: data.text,
      createdAt: Date.now(), updatedAt: Date.now()
    });
  }
  saveTasks();
  closeEntryModal();
  render();
}

function deleteCurrentEntry() {
  if (!currentEntryId) return;
  var kind = currentEntryKind;
  if (!confirm(kind === 'note' ? 'Удалить заметку?' : 'Удалить протокол?')) return;
  if (kind === 'note') notes = notes.filter(function(x) { return x.id !== currentEntryId; });
  else protocols = protocols.filter(function(x) { return x.id !== currentEntryId; });
  saveTasks();
  closeEntryModal();
  render();
}

/* ---------- Rendering ---------- */
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatDue(due) {
  var parts = due.split('-');
  return parts[2] + '.' + parts[1] + '.' + parts[0].slice(2);
}

var prioRank = { high: 0, normal: 1, low: 2 };
var prioLabel = { high: 'Срочно', normal: 'Важно', low: 'Херня' };

function renderList() {
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t) { t.classList.toggle('active', t.dataset.filter === filter); });

  var today = todayStr();
  var visible = tasks.filter(function(t) {
    if (t.projectId !== currentProject) return false;
    if (filter === 'active') return !t.done;
    if (filter === 'done') return t.done;
    return true;
  });

  visible.sort(function(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    if (prioRank[a.priority] !== prioRank[b.priority]) return prioRank[a.priority] - prioRank[b.priority];
    return a.createdAt - b.createdAt;
  });

  var listEl = document.getElementById('task-list');
  listEl.innerHTML = '';

  if (visible.length === 0) {
    var msg = filter === 'done' ? 'Завершённых задач пока нет'
            : filter === 'active' ? 'Активных задач нет — всё сделано'
            : 'В этом проекте пока нет задач';
    listEl.innerHTML = '<div class="empty-state">' + msg + '</div>';
  } else {
    visible.forEach(function(t) {
      var row = document.createElement('div');
      row.className = 'task-row' + (t.done ? ' done' : '') + (t.priority === 'high' ? ' prio-high' : '');
      if (!t.done && t.due) {
        if (t.due < today) row.classList.add('overdue');
        else if (t.due === today) row.classList.add('due-today');
      }
      // Клик по всей карточке открывает детали
      row.onclick = function() { openTaskModal(t.id); };

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'task-checkbox';
      cb.checked = t.done;
      cb.onclick = function(e) { e.stopPropagation(); toggleDone(t.id); };
      row.appendChild(cb);

      var main = document.createElement('div');
      main.className = 'task-main';

      var title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = t.title;
      main.appendChild(title);

      if (t.description && t.description.trim()) {
        var desc = document.createElement('div');
        desc.className = 'task-desc';
        desc.textContent = t.description.trim().replace(/\s+/g, ' ');
        main.appendChild(desc);
      }

      var meta = document.createElement('div');
      meta.className = 'task-meta';

      var prio = document.createElement('span');
      prio.className = 'pill';
      var dot = document.createElement('span');
      dot.className = 'dot ' + t.priority;
      prio.appendChild(dot);
      prio.appendChild(document.createTextNode(prioLabel[t.priority] || 'Важно'));
      meta.appendChild(prio);

      if (t.due) {
        var duePill = document.createElement('span');
        duePill.className = 'pill';
        var label = formatDue(t.due);
        if (!t.done && t.due < today) { duePill.className += ' overdue'; label = 'Просрочено · ' + label; }
        else if (!t.done && t.due === today) { duePill.className += ' today'; label = 'Сегодня'; }
        duePill.textContent = label;
        meta.appendChild(duePill);
      }

      main.appendChild(meta);
      row.appendChild(main);

      var del = document.createElement('button');
      del.className = 'task-del';
      del.textContent = '×';
      del.title = 'Удалить задачу';
      del.onclick = function(e) { e.stopPropagation(); deleteTask(t.id); };
      row.appendChild(del);

      listEl.appendChild(row);
    });
  }

}

function render() {
  // ---- Sidebar: projects with active-task counts ----
  var projList = document.getElementById('projects-list');
  projList.innerHTML = '';
  projects.forEach(function(p) {
    var row = document.createElement('button');
    row.className = 'proj' + (!globalView && currentProject === p.id ? ' active' : '');
    row.dataset.id = p.id;
    row.onclick = function() { if (!_projDragMoved) selectProject(p.id); };

    var grip = document.createElement('span');
    grip.className = 'proj-drag';
    grip.textContent = '⠿';
    grip.title = 'Потяните, чтобы переставить проект';
    grip.addEventListener('pointerdown', projDragStart);
    grip.addEventListener('click', function(e) { e.stopPropagation(); e.preventDefault(); });
    row.appendChild(grip);

    var name = document.createElement('span');
    name.className = 'proj-name';
    name.textContent = p.name;
    row.appendChild(name);

    var n = tasks.filter(function(t) { return t.projectId === p.id && !t.done; }).length;
    if (n > 0) {
      var cnt = document.createElement('span');
      cnt.className = 'proj-count';
      cnt.textContent = n;
      row.appendChild(cnt);
    }

    var edit = document.createElement('span');
    edit.className = 'proj-edit';
    edit.textContent = '✎';
    edit.title = 'Переименовать или удалить';
    edit.onclick = function(e) { e.stopPropagation(); renameProject(p.id); };
    row.appendChild(edit);

    projList.appendChild(row);
  });

  // ---- Header: current project name ----
  var proj = projects.find(function(p) { return p.id === currentProject; });
  var titleEl = document.getElementById('project-title');
  titleEl.textContent = globalView === 'today' ? 'Сегодня'
                      : globalView === 'dashboard' ? 'Дашборд'
                      : (proj ? proj.name : 'Задачник');
  titleEl.title = titleEl.textContent;

  var today = todayStr();
  renderViewTabs();
  if (globalView === 'dashboard') renderDashboard();
  else if (globalView === 'today') renderToday();
  else if (currentView === 'list') renderList();
  else if (currentView === 'week') renderWeek();
  else if (currentView === 'today') renderToday();
  else if (currentView === 'protocols') renderEntries('protocol');
  else if (currentView === 'notes') renderEntries('note');

  // ---- Stats for current project ----
  var mine = tasks.filter(function(t) { return t.projectId === currentProject; });
  var activeCount = mine.filter(function(t) { return !t.done; }).length;
  var overdueCount = mine.filter(function(t) { return !t.done && t.due && t.due < today; }).length;
  var todayCount = mine.filter(function(t) { return !t.done && t.due === today; }).length;
  var parts = ['Активных: ' + activeCount];
  if (todayCount > 0) parts.push('на сегодня: ' + todayCount);
  if (overdueCount > 0) parts.push('<span class="overdue-count">просрочено: ' + overdueCount + '</span>');
  document.getElementById('stats').innerHTML = parts.join(' · ');

  setTimeout(syncHeaderHeight, 0);
}

// высота липкой шапки — под ней «прилипают» дата, неделя и фильтры списка
function syncHeaderHeight() {
  var header = document.querySelector('header');
  if (!header) return;
  document.documentElement.style.setProperty('--header-height', header.offsetHeight + 'px');
}
window.addEventListener('resize', syncHeaderHeight);
